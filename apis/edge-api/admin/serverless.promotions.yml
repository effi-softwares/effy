# The promotion routes of the admin service: the same src/ deployed as a second stack, because the
# admin stack passed CloudFormation's 500-resource limit. Same paths, same back-office authorizer.
# Deploy `service=admin` first, then `SERVICE=admin-promotions`: a route key may exist once per gateway.
service: effy-edge-admin-promotions
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  # Every integration invokes $latest, so per-deploy Versions would only spend resources.
  versionFunctions: false
  tags:
    project: effy
    slice: 095-promotion-skins
    service: admin-promotions
  httpApi:
    id: ${ssm:/effy/${sls:stage}/staff/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    LIVE_REALTIME_HOST: ${ssm:/effy/${sls:stage}/live/realtime_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
    MEDIA_PUBLIC_BASE_URL: ${ssm:/effy/${sls:stage}/media/public_base_url}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
        # Presigned PUTs and reads on the media bucket's objects only.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  # Promotions, groups and skins. Read: any active staff; mutate: admin/manager. Every mutation audits.
  promotionsListV1:
    handler: src/functions/promotions-list-v1-get.handler
    description: List promotions (paged; state, kind, trigger, group; counts per state) — 094
    events:
      - httpApi:
          method: GET
          path: /admin/v1/promotions
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsCreateV1:
    handler: src/functions/promotions-create-v1-post.handler
    description: Create a promotion (draft unless published) — 094
    events:
      - httpApi:
          method: POST
          path: /admin/v1/promotions
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsProductsV1:
    handler: src/functions/promotions-products-v1-get.handler
    description: Products a promotion can target, by name, SKU or brand — 094
    events:
      - httpApi:
          method: GET
          path: /admin/v1/promotions/products
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsDetailV1:
    handler: src/functions/promotions-detail-v1-get.handler
    description: A promotion in full — 094
    events:
      - httpApi:
          method: GET
          path: /admin/v1/promotions/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsUpdateV1:
    handler: src/functions/promotions-update-v1-patch.handler
    description: Edit a promotion; what it gives and who it is for are fixed once used — 094
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/promotions/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsActionsV1:
    handler: src/functions/promotions-actions-v1-post.handler
    description: Publish, pause, resume, end or archive a promotion — 094
