    # ── Email deliverability (037) ────────────────────────────────────────────────────────────
    #
    # ⚠ THESE FOUR DEPART FROM THE CONVENTION ABOVE, DELIBERATELY: they carry AlarmActions.
    # The 44 alarms preceding them have none — they turn red in a console nobody watches. Copying
    # that wholesale would have shipped four brand-new alarms that notify nobody, in the slice whose
    # entire purpose is that someone finds out (037 FR-037).
    #
    # ⚠ The remaining 44 here (and 32 in the shop service) stay unwired and are recorded as an
    # explicit carry-forward under FR-037a — named and counted, not quietly absorbed.
    SesEventConsumerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ses-event-consumer-errors
        AlarmDescription: >-
          The delivery-outcome consumer is failing. While it is down the platform is BLIND to
          per-address delivery failures — which is the exact condition 037 exists to remove.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions: [{ Name: FunctionName, Value: !Ref SesEventConsumerLambdaFunction }]
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: ["${ssm:/effy/${sls:stage}/alerts/topic_arn}"]
    SesIdentityHealthErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ses-identity-health-errors
        AlarmDescription: >-
          The MAIL FROM probe is failing. Its metric alarm treats missing data as breaching, so this
          is the earlier and more specific signal.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions: [{ Name: FunctionName, Value: !Ref SesIdentityHealthLambdaFunction }]
        Statistic: Sum
        Period: 3600
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: ["${ssm:/effy/${sls:stage}/alerts/topic_arn}"]
    DeliverabilityListV1ErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
