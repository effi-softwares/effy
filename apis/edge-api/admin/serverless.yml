# edge-admin — Effy back-office/admin service (004-backend-bootstrap A3; hosts the
# 005 back-office console's endpoints). Attaches to the Terraform-owned STAFF HTTP API
# (075; docs/api/shared-gateway.md): NO API/stage/CORS/authorizers here. Routes live under /admin/.
service: effy-edge-admin
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    # 🧑‍💻 CONFIRM the latest Parameters-and-Secrets extension layer version for the region.
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  # ⚠ 049 — the admin service has grown to 94 functions; with a Lambda Version per function the stack
  # hit CloudFormation's hard 500-resource limit (511) when the driver-management routes landed. We
  # publish no aliases and use no provisioned concurrency, and every httpApi integration invokes the
  # unqualified ($LATEST) ARN — so per-deploy Versions are dead weight. Turning them off removes ~94
  # resources with zero runtime change (routing is unaffected; existing Version resources are cleaned
  # up on the next deploy). The real long-term lever if it grows again is nested stacks
  # (serverless-plugin-split-stacks), deferred until needed.
  versionFunctions: false
  tags:
    project: effy
    slice: 004-backend-bootstrap
    service: admin
  httpApi:
    id: ${ssm:/effy/${sls:stage}/staff/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # 071 — the live-update channel. Published to after a change commits; named in the handshake an
    # app makes. No default: a service deployed before the channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    LIVE_REALTIME_HOST: ${ssm:/effy/${sls:stage}/live/realtime_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    # Shop-pool provisioning (009): the pool id the shops slice creates users in. Resolved from
    # the auth contract at deploy time — never hard-coded (R3).
    SHOP_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_id}
    # Promotional banner artwork (028). The SAME bucket product media uses — banners live under a
    # `promotions/` prefix rather than in a bucket of their own, so one bucket policy and one
    # lifecycle rule cover all operator-uploaded imagery.
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
    # Email deliverability (037). The sending domain is what the hourly MAIL FROM probe inspects;
    # the alerts topic is what every alarm below notifies. Both from the SSM contract — never a
    # literal (contracts/ssm-mail.contract.md).
    MAIL_SENDING_DOMAIN: ${sls:stage}.effyshopping.com
    MAIL_ALERTS_TOPIC_ARN: ${ssm:/effy/${sls:stage}/alerts/topic_arn}
    # ── 046: feedback reply email (US3) ────────────────────────────────────────────────────────────
    #
    # ⚠ email-kit's send path reads exactly these keys (its exported MAIL_ENV_KEYS); a config-contract
    # test (src/feedback/config.contract.test.ts) fails if one is missing. The values are the SAME SSM
    # contract edge-customer uses (037/038) — the customer-facing reply-to is hello@; internal falls
    # back to it until workspace-admin@ is published.
    MAIL_SENDER: ${ssm:/effy/${sls:stage}/ses/sender}
    MAIL_REPLY_TO: ${ssm:/effy/${sls:stage}/ses/reply_to}
    MAIL_REPLY_TO_INTERNAL: ${ssm:/effy/${sls:stage}/ses/reply_to_internal, ''}
    MAIL_CONFIGURATION_SET: ${ssm:/effy/${sls:stage}/ses/configuration_set}
    MAIL_POSTAL_ADDRESS: ${ssm:/effy/${sls:stage}/mail/postal_address, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
        # Banner artwork (028): scoped to the media bucket's OBJECT ARN — never a wildcard. Presigned
        # URLs inherit this identity's authority, so a broader grant here would be a broader grant
        # handed to whoever holds the url. Mirrors the shop service's product-media statement.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
        # Shop-management provisioning (009): admin Cognito actions, scoped to the SHOP pool ARN
        # ONLY (least privilege). An authorized server-side provisioning write, not token brokering
        # — the routes stay behind the back-office authorizer (Constitution Check, research R3).
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
          Resource: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_arn}
        # ⚠ The driver-pool Cognito grant that stood here (049) MOVED TO `apis/edge-api/fleet` with
        # the routes that used it (056). Nothing in this service touches the driver pool any more, and
        # a grant nothing uses is a standing permission with no purpose — the kind that survives until
        # something else finds it.
        # Email deliverability (037). Three reads and ONE delete, all scoped to this environment's
        # SES identity — never "*". ⚠ There is deliberately no PutSuppressedDestination: nothing in
        # the product needs to make a person unreachable by hand, and a button that can silently
        # disable someone's only credential is a weapon, not a feature.
        - Effect: Allow
          Action:
            - ses:GetEmailIdentity
            - ses:GetSuppressedDestination
            - ses:DeleteSuppressedDestination
          Resource: ${ssm:/effy/${sls:stage}/ses/identity_arn}
        # The hourly MAIL FROM probe publishes its own metric — AWS provides none for this.
        - Effect: Allow
          Action: cloudwatch:PutMetricData
          Resource: "*"
          Condition:
            StringEquals:
              cloudwatch:namespace: Effy/Mail
        # 076 — publish live updates, to this environment's channel only. Until 076 this service
        # announced nothing (it is configuration); a coverage change now tells an open Coverage
        # screen to re-read.
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        # ── 075: how full is each gateway? ──────────────────────────────────────────────────────────
        #
        # Read-only, and only the two lists the hourly `gatewayUsage` function counts, on exactly the
        # two gateways this environment owns. ⚠ Not `apigateway:GET` on `*`: that reads every API in
        # the account, including each one's authorizer configuration.
        - Effect: Allow
          Action: apigateway:GET
          Resource:
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/edge/http_api_id}/routes
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/edge/http_api_id}/integrations
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/staff/http_api_id}/routes
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/staff/http_api_id}/integrations
        # ── 046: feedback reply email (US3) ─────────────────────────────────────────────────────────
        #
        # ⚠ ses:SendEmail authorizes against EVERY resource the request touches, and 037 made every send
        # name a configuration set — so BOTH the identity AND the configuration set, or the send is
        # denied (the same fix edge-customer needed). Scoped to this environment's identity, never "*".
        - Effect: Allow
          Action: ses:SendEmail
          Resource:
            - ${ssm:/effy/${sls:stage}/ses/identity_arn}
            - ${ssm:/effy/${sls:stage}/ses/configuration_set_arn}
  layers:
    - ${param:secretsExtensionArn}
  # NO provider.vpc — the functions run OUTSIDE the VPC (dev posture, 2026-07-12). An in-VPC
  # Lambda has no internet without NAT, so every public AWS API it calls (Cognito, for the 009
  # shop-user provisioning) hangs to its timeout unless given an interface endpoint. Running
  # outside the VPC gives Cognito + Secrets Manager a working path for $0 and drops ~$18/mo of
  # endpoints. The trade: these functions reach the DB over its PUBLIC endpoint, so the dev DB
  # admits 0.0.0.0/0 (TLS forced, RDS-managed 32-char password). DEV ONLY — see infra/envs/README.md.

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  # Two probes, both PUBLIC and unversioned. Split on purpose: a combined probe cannot tell
  # "this service is not deployed" from "the database is down" — both just look red.
  liveV1:
    handler: src/functions/live-v1-get.handler
    description: Which live-update channel is this person's — read on sign-in and reconnect, never on a timer — 071
    events:
      - httpApi:
          method: GET
          path: /admin/v1/live
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the admin service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /admin/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the admin service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /admin/readyz

  backOfficePingV1:
    handler: src/functions/back-office-ping-v1-get.handler
    description: Identity-enforcement proving route (back-office pool + group RBAC)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/ping
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  backOfficeMeV1:
    handler: src/functions/back-office-me-v1-get.handler
    description: Staff-identity read — records (JIT upsert) + returns the platform record (005)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/me
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  backOfficeAdminPingV1:
    handler: src/functions/back-office-admin-ping-v1-get.handler
    description: Administrator-only proving route — authorizes from the DB record (005)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/admin-ping
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # ── Shop management (009). All back-office authorizer; read = any active staff, mutate = admin/manager. ──
  shopsListV1:
    handler: src/functions/shops-list-v1-get.handler
    description: List shops (paginated/filterable/searchable) — 009
    events:
      - httpApi:
          method: GET
          path: /admin/v1/shops
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopGetV1:
    handler: src/functions/shop-get-v1-get.handler
    description: Shop detail + roster — 009
    events:
      - httpApi:
          method: GET
          path: /admin/v1/shops/{shopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopAuditV1:
    handler: src/functions/shop-audit-v1-get.handler
    description: Shop + user audit history — 009
    events:
      - httpApi:
          method: GET
          path: /admin/v1/shops/{shopId}/audit
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopCreateV1:
    handler: src/functions/shop-create-v1-post.handler
    description: Create shop + provision primary manager — 009
    events:
      - httpApi:
          method: POST
          path: /admin/v1/shops
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopUpdateV1:
    handler: src/functions/shop-update-v1-patch.handler
    description: Edit shop details — 009
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/shops/{shopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopStatusV1:
    handler: src/functions/shop-status-v1-post.handler
    description: Change shop lifecycle status — 009
    events:
      - httpApi:
          method: POST
          path: /admin/v1/shops/{shopId}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopDeleteV1:
    handler: src/functions/shop-delete-v1-delete.handler
    description: Remove a dependent-free shop — 009
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/shops/{shopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopUserCreateV1:
    handler: src/functions/shop-user-create-v1-post.handler
    description: Add a user to a shop (provision) — 009
    events:
      - httpApi:
          method: POST
          path: /admin/v1/shops/{shopId}/users
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopUserUpdateV1:
    handler: src/functions/shop-user-update-v1-patch.handler
    description: Change a shop user's role and/or status — 009
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/shops/{shopId}/users/{userId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # ── Driver management MOVED OUT (056-driver-management). ──────────────────────────────────────
  # 049 landed five routes here as a "minimal provisioning adjunct" so the driver app had accounts to
  # sign in as, and recorded in its own spec that "a full driver-management console is out of scope
  # for this slice unless folded in during planning."
  #
  # 056 is that console, and it does not fit here. This stack packaged to 434 of CloudFormation's
  # hard 500 resources with `versionFunctions: false` ALREADY SPENT — and the header of this file
  # records that it was the driver routes that tipped it to 511 in the first place. ~18 more routes
  # at ~5 resources each is not available at any price this stack can pay.
  #
  # The five routes now live in `apis/edge-api/fleet` under /fleet/v1/*, behind the SAME back-office
  # authorizer. Removing them here reclaims ~25 resources — the first time this stack has gone down
  # rather than up. The driver-pool Cognito grant and DRIVER_USER_POOL_ID moved with them; nothing
  # left in this service touches the driver pool.
  #
  # ⚠ DEPLOY ORDER MATTERS: deploy `fleet` BEFORE re-deploying this service, or there is a window in
  # which driver management answers nothing at all.

  # ── Promotional codes & order rules (027 US10). Back-office authorizer; read = any active staff
  #    (support answers "is this code live?"), mutate = admin/manager. Every mutation audits.
  #    ⚠ The codes themselves are DECIDED by the commerce service at apply and at intent time —
  #    this surface only defines them. Two paths, one capability, exactly Principle III. ──
  promotionsListV1:
    handler: src/functions/promotions-list-v1-get.handler
    description: List promotional codes (paged, filter by status, search by code) — 027
    events:
      - httpApi:
          method: GET
          path: /admin/v1/promotions
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsCreateV1:
    handler: src/functions/promotions-create-v1-post.handler
    description: Create a promotional code — 027 FR-050
    events:
      - httpApi:
          method: POST
          path: /admin/v1/promotions
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsDetailV1:
    handler: src/functions/promotions-detail-v1-get.handler
    description: A code's definition, usage against its caps, and attribution — 027 FR-067
    events:
      - httpApi:
          method: GET
          path: /admin/v1/promotions/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsUpdateV1:
    handler: src/functions/promotions-update-v1-patch.handler
    description: Edit window/caps always; value only while unredeemed — 027 FR-068
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/promotions/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsStatusV1:
    handler: src/functions/promotions-status-v1-post.handler
    description: Enable or disable a code — 027 FR-069
    events:
      - httpApi:
          method: POST
          path: /admin/v1/promotions/{id}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsDeleteV1:
    handler: src/functions/promotions-delete-v1-delete.handler
    description: Delete a never-redeemed code (used codes disable, never delete) — 027 FR-070
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/promotions/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsBannerImageV1:
    handler: src/functions/promotions-banner-image-v1-post.handler
    description: Presign a PUT for promotional banner artwork — 028 FR-037b
    events:
      - httpApi:
          method: POST
          path: /admin/v1/promotions/{id}/banner-image/presign
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  promotionsAuditV1:
    handler: src/functions/promotions-audit-v1-get.handler
    description: A code's change history — 027 FR-071
    events:
      - httpApi:
          method: GET
          path: /admin/v1/promotions/{id}/audit
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  orderPolicyReadV1:
    handler: src/functions/order-policy-v1-get.handler
    description: The minimum spend and the two cart ceilings — 027 FR-053
    events:
      - httpApi:
          method: GET
          path: /admin/v1/order-policy
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  orderPolicyWriteV1:
    handler: src/functions/order-policy-v1-put.handler
    description: Set the minimum spend and the cart ceilings — 027 FR-053
    events:
      - httpApi:
          method: PUT
          path: /admin/v1/order-policy
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # ── Catalog schema authority (016). All back-office authorizer; read = any active staff,
  #    mutate = admin/manager (contracts/admin-catalog.contract.md). Every mutation audits. ──
  catalogProductTypesListV1:
    handler: src/functions/catalog-product-types-list-v1-get.handler
    description: List product types + assigned attributes — 016
    events:
      - httpApi:
          method: GET
          path: /admin/v1/catalog/product-types
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeGetV1:
    handler: src/functions/catalog-product-types-get-v1-get.handler
    description: Product type detail — 016
    events:
      - httpApi:
          method: GET
          path: /admin/v1/catalog/product-types/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeCreateV1:
    handler: src/functions/catalog-product-types-create-v1-post.handler
    description: Create a product type — 016
    events:
      - httpApi:
          method: POST
          path: /admin/v1/catalog/product-types
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeUpdateV1:
    handler: src/functions/catalog-product-types-update-v1-patch.handler
    description: Edit a product type — 016
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/catalog/product-types/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeStatusV1:
    handler: src/functions/catalog-product-types-status-v1-post.handler
    description: Retire/activate a product type — 016
    events:
      - httpApi:
          method: POST
          path: /admin/v1/catalog/product-types/{id}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeAssignV1:
    handler: src/functions/catalog-product-type-attributes-assign-v1-post.handler
    description: Assign an attribute to a product type — 016
    events:
      - httpApi:
          method: POST
          path: /admin/v1/catalog/product-types/{id}/attributes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeAssignUpdateV1:
    handler: src/functions/catalog-product-type-attributes-update-v1-patch.handler
    description: Edit a type↔attribute assignment — 016
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/catalog/product-types/{id}/attributes/{attrId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogProductTypeUnassignV1:
    handler: src/functions/catalog-product-type-attributes-unassign-v1-delete.handler
    description: Unassign an attribute from a product type — 016
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/catalog/product-types/{id}/attributes/{attrId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogAttributesListV1:
    handler: src/functions/catalog-attributes-list-v1-get.handler
    description: List attribute definitions — 016
    events:
      - httpApi:
          method: GET
          path: /admin/v1/catalog/attributes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogAttributeGetV1:
    handler: src/functions/catalog-attributes-get-v1-get.handler
    description: Attribute definition detail — 016
    events:
      - httpApi:
          method: GET
          path: /admin/v1/catalog/attributes/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogAttributeCreateV1:
    handler: src/functions/catalog-attributes-create-v1-post.handler
    description: Create an attribute definition — 016
    events:
      - httpApi:
          method: POST
          path: /admin/v1/catalog/attributes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogAttributeUpdateV1:
    handler: src/functions/catalog-attributes-update-v1-patch.handler
    description: Edit an attribute definition — 016
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/catalog/attributes/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  catalogAttributeStatusV1:
    handler: src/functions/catalog-attributes-status-v1-post.handler
    description: Retire/activate an attribute (in-use → 409) — 016
    events:
      - httpApi:
          method: POST
          path: /admin/v1/catalog/attributes/{id}/status
