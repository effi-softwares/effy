resources:
  Resources:

    # ── Email deliverability (037) ────────────────────────────────────────────────────────────
    #
    # ⚠ EVERY ALARM IN A SERVICE CARRIES AlarmActions, OR IT IS NOT AN ALARM. This file once held 44
    # more — one "this function had an error" alarm per route — and the shop service 32. None had an
    # action: they turned red in a console nobody watched, and cost $0.10 a month each to do it
    # (037 recorded them as a carry-forward, FR-037a). They were removed on 2026-10-05.
    #
    # What replaced them is ONE alarm that notifies: `effy-<env>-edge-api-5xx` on the shared gateway
    # (infra/envs/<env>/edge-gateway.tf) covers a server error on any route of any service.
    #
    # ⚠ So a per-function alarm belongs here only for a function the gateway cannot see — one run
    # by a schedule, a queue or a topic — or for a failure that is not a 5xx. The four below are
    # those, and they are wired (037 FR-037).
    SesEventConsumerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ses-event-consumer-errors
        AlarmDescription: >-
          The delivery-outcome consumer is failing. While it is down the platform is BLIND to
          per-address delivery failures — which is the exact condition 037 exists to remove.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions: [{ Name: FunctionName, Value: !Ref SesEventConsumerLambdaFunction }]
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: ["${ssm:/effy/${sls:stage}/alerts/topic_arn}"]
    SesIdentityHealthErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ses-identity-health-errors
        AlarmDescription: >-
          The MAIL FROM probe is failing. Its metric alarm treats missing data as breaching, so this
          is the earlier and more specific signal.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions: [{ Name: FunctionName, Value: !Ref SesIdentityHealthLambdaFunction }]
        Statistic: Sum
        Period: 3600
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: ["${ssm:/effy/${sls:stage}/alerts/topic_arn}"]
    DeliverabilityListV1ErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-deliverability-list-v1-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions: [{ Name: FunctionName, Value: !Ref DeliverabilityListV1LambdaFunction }]
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: ["${ssm:/effy/${sls:stage}/alerts/topic_arn}"]
    DeliverabilityRepairV1ErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-deliverability-repair-v1-errors
        AlarmDescription: >-
          The repair path is failing. An operator trying to unlock someone cannot, and the person
          stays locked out of an account that may have no other credential.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions: [{ Name: FunctionName, Value: !Ref DeliverabilityRepairV1LambdaFunction }]
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: ["${ssm:/effy/${sls:stage}/alerts/topic_arn}"]
