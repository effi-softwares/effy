# Alarms: see `resources:` at the end of this file — only ones that notify, and only for what the
# gateway's 5xx alarm (Terraform, A3) cannot see.
  # ── Email deliverability (037-platform-email-delivery) ──────────────────────────────────────

  # ⚠ THE ONLY THING ON THIS PLATFORM THAT CAN SEE ONE PERSON BEING LOCKED OUT. A send to a blocked
  # address returns success and delivers nothing; the rate alarms cannot help, because one person
  # never moves a rate.
  #
  # ⚠ NO filterPolicy. SES publishes the discriminator in the message BODY, not in message
  # attributes, so an attribute filter would silently match nothing — a subscription that looks
  # configured and receives zero events. Filtering happens in the consumer, where it is visible and
  # testable.
  #
  # ⚠ topicName is REQUIRED alongside arn. Serverless uses it to name the CloudFormation
  # subscription resources; omitting it with an explicit arn is a common deploy failure.
  sesEventConsumer:
    handler: src/functions/ses-event-consumer.handler
    description: Consume SES delivery outcomes → public.email_delivery_* (037)
    timeout: 30
    events:
      - sns:
          arn: ${ssm:/effy/${sls:stage}/ses/events_topic_arn}
          topicName: effy-${sls:stage}-ses-events

  # ⚠ EXISTS BECAUSE AWS PROVIDES NO SIGNAL. There is no CloudWatch metric and no EventBridge event
  # for a broken custom MAIL FROM; the only native notification goes to the AWS account root
  # address. See the handler's header.
  sesIdentityHealth:
    handler: src/functions/ses-identity-health.handler
    description: Hourly MAIL FROM / DKIM health probe → Effy/Mail metric (037)
    timeout: 15
    events:
      - schedule: rate(1 hour)

  # ── 075: gateway usage ───────────────────────────────────────────────────────────────────────────
  # ⚠ No route — and so no integration: the function that counts integrations must not be one.
  # It lives here because it is platform health for the operator, beside the other hourly probe.
  # Its failed-invocation alarm is infra/envs/<env>/background-functions.tf (gateway-usage); the
  # 75% / 90% alarms on what it reports are infra/envs/<env>/gateway-usage.tf.
  gatewayUsage:
    handler: src/functions/gateway-usage-scheduled.handler
    description: Hourly count of routes and integrations on both API gateways → Effy/Platform GatewayUsagePercent (075)
    timeout: 30
    environment:
      # The one stack that reads BOTH gateways' ids: it measures both. It attaches only to staff.
      SHARED_HTTP_API_ID: ${ssm:/effy/${sls:stage}/edge/http_api_id}
      STAFF_HTTP_API_ID: ${ssm:/effy/${sls:stage}/staff/http_api_id}
    events:
      - schedule: rate(1 hour)

