# Back-office admin routes on the staff gateway, under /admin/.
service: effy-edge-admin
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  # Every integration invokes $latest, so per-deploy Versions would only spend CloudFormation resources.
  versionFunctions: false
  tags:
    project: effy
    slice: 004-backend-bootstrap
    service: admin
  httpApi:
    id: ${ssm:/effy/${sls:stage}/staff/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # No default: a deploy before the live channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    LIVE_REALTIME_HOST: ${ssm:/effy/${sls:stage}/live/realtime_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    SHOP_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_id}
    # Operator-uploaded imagery shares the product media bucket, under `promotions/`.
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
    MEDIA_PUBLIC_BASE_URL: ${ssm:/effy/${sls:stage}/media/public_base_url}
    # The sending domain the mail from probe inspects, and the alerts topic; both from SSM.
    MAIL_SENDING_DOMAIN: ${sls:stage}.effyshopping.com
    MAIL_ALERTS_TOPIC_ARN: ${ssm:/effy/${sls:stage}/alerts/topic_arn}
    # Feedback replies: every key in email-kit's MAIL_ENV_KEYS (feedback/config.contract.test.ts checks).
    MAIL_SENDER: ${ssm:/effy/${sls:stage}/ses/sender}
    MAIL_REPLY_TO: ${ssm:/effy/${sls:stage}/ses/reply_to}
    MAIL_REPLY_TO_INTERNAL: ${ssm:/effy/${sls:stage}/ses/reply_to_internal, ''}
    MAIL_CONFIGURATION_SET: ${ssm:/effy/${sls:stage}/ses/configuration_set}
    MAIL_POSTAL_ADDRESS: ${ssm:/effy/${sls:stage}/mail/postal_address, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
        # The media bucket's object ARN only: presigned URLs inherit this identity's authority.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
        # Admin Cognito actions on the shop pool only.
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
          Resource: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_arn}
        # SES suppression: three reads and one delete, on this environment's identity. No PutSuppressedDestination.
        - Effect: Allow
          Action:
            - ses:GetEmailIdentity
            - ses:GetSuppressedDestination
            - ses:DeleteSuppressedDestination
          Resource: ${ssm:/effy/${sls:stage}/ses/identity_arn}
        - Effect: Allow
          Action: cloudwatch:PutMetricData
          Resource: "*"
          Condition:
            StringEquals:
              cloudwatch:namespace: Effy/Mail
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        # Gateway usage: read-only, the two lists counted, on this environment's two gateways only.
        - Effect: Allow
          Action: apigateway:GET
          Resource:
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/edge/http_api_id}/routes
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/edge/http_api_id}/integrations
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/staff/http_api_id}/routes
            - arn:aws:apigateway:${aws:region}::/apis/${ssm:/effy/${sls:stage}/staff/http_api_id}/integrations
        # Feedback replies: the identity and the configuration set, or the send is denied.
        - Effect: Allow
          Action: ses:SendEmail
          Resource:
            - ${ssm:/effy/${sls:stage}/ses/identity_arn}
            - ${ssm:/effy/${sls:stage}/ses/configuration_set_arn}
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc: without NAT an in-VPC Lambda cannot reach Cognito or Secrets Manager (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  # Two probes: a combined one cannot tell "not deployed" from "database down".
  liveV1:
    handler: src/functions/live-v1-get.handler
    description: Which live-update channel is this person's — read on sign-in and reconnect, never on a timer — 071
    events:
      - httpApi:
          method: GET
          path: /admin/v1/live
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the admin service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /admin/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the admin service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /admin/readyz

  backOfficeMeV1:
    handler: src/functions/back-office-me-v1-get.handler
    description: Staff-identity read — records (JIT upsert) + returns the platform record (005)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/me
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  backOfficeAdminPingV1:
    handler: src/functions/back-office-admin-ping-v1-get.handler
    description: Administrator-only proving route — authorizes from the DB record (005)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/admin-ping
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # Shop management. Read: any active staff; mutate: admin/manager.
  shopsListV1:
    handler: src/functions/shops-list-v1-get.handler
    description: List shops (paginated/filterable/searchable) — 009
    events:
      - httpApi:
          method: GET
          path: /admin/v1/shops
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopGetV1:
    handler: src/functions/shop-get-v1-get.handler
    description: Shop detail + roster — 009
    events:
      - httpApi:
          method: GET
          path: /admin/v1/shops/{shopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopAuditV1:
    handler: src/functions/shop-audit-v1-get.handler
    description: Shop + user audit history — 009
    events:
      - httpApi:
          method: GET
          path: /admin/v1/shops/{shopId}/audit
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopCreateV1:
    handler: src/functions/shop-create-v1-post.handler
    description: Create shop + provision primary manager — 009
    events:
      - httpApi:
          method: POST
          path: /admin/v1/shops
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopUpdateV1:
    handler: src/functions/shop-update-v1-patch.handler
    description: Edit shop details — 009
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/shops/{shopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopStatusV1:
    handler: src/functions/shop-status-v1-post.handler
    description: Change shop lifecycle status — 009
    events:
      - httpApi:
          method: POST
          path: /admin/v1/shops/{shopId}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopDeleteV1:
    handler: src/functions/shop-delete-v1-delete.handler
    description: Remove a dependent-free shop — 009
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/shops/{shopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopUserCreateV1:
    handler: src/functions/shop-user-create-v1-post.handler
    description: Add a user to a shop (provision) — 009
    events:
      - httpApi:
          method: POST
          path: /admin/v1/shops/{shopId}/users
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  shopUserUpdateV1:
    handler: src/functions/shop-user-update-v1-patch.handler
    description: Change a shop user's role and/or status — 009
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/shops/{shopId}/users/{userId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # Order rules. The promotion routes are in serverless.promotions.yml.
  orderPolicyReadV1:
    handler: src/functions/order-policy-v1-get.handler
    description: The minimum spend and the two cart ceilings — 027 FR-053
    events:
      - httpApi:
          method: GET
          path: /admin/v1/order-policy
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  orderPolicyWriteV1:
    handler: src/functions/order-policy-v1-put.handler
    description: Set the minimum spend and the cart ceilings — 027 FR-053
    events:
      - httpApi:
          method: PUT
          path: /admin/v1/order-policy
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

# Email deliverability: the only thing that sees one person locked out. No filterPolicy: SES puts
# the discriminator in the body, so filtering is in the consumer. topicName is required with arn.
  sesEventConsumer:
    handler: src/functions/ses-event-consumer.handler
    description: Consume SES delivery outcomes → public.email_delivery_* (037)
    timeout: 30
    events:
      - sns:
          arn: ${ssm:/effy/${sls:stage}/ses/events_topic_arn}
          topicName: effy-${sls:stage}-ses-events

  # AWS gives no signal for a broken custom mail from.
  sesIdentityHealth:
    handler: src/functions/ses-identity-health.handler
    description: Hourly MAIL FROM / DKIM health probe → Effy/Mail metric (037)
    timeout: 15
    events:
      - schedule: rate(1 hour)

  # Gateway usage: no route, so it is not itself an integration. Alarms in background-functions.tf and gateway-usage.tf.
  gatewayUsage:
    handler: src/functions/gateway-usage-scheduled.handler
    description: Hourly count of routes and integrations on both API gateways → Effy/Platform GatewayUsagePercent (075)
    timeout: 30
    environment:
      # The one stack that reads both gateways' ids; it attaches only to staff.
      SHARED_HTTP_API_ID: ${ssm:/effy/${sls:stage}/edge/http_api_id}
      STAFF_HTTP_API_ID: ${ssm:/effy/${sls:stage}/staff/http_api_id}
    events:
      - schedule: rate(1 hour)

  deliverabilityListV1:
    handler: src/functions/deliverability-list-v1-get.handler
    description: List addresses the platform cannot reach — 037
    events:
      - httpApi:
          method: GET
          path: /admin/v1/deliverability
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliverabilityDetailV1:
    handler: src/functions/deliverability-detail-v1-get.handler
    description: One address's delivery state and live suppression state — 037 (its events: /activity, 104)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/deliverability/{address}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliverabilityActivityV1:
    handler: src/functions/deliverability-activity-v1-get.handler
    description: One address's email events, searched, filtered, paged and exported — the activity drawer (104)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/deliverability/{address}/activity
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliverabilityRepairV1:
    handler: src/functions/deliverability-repair-v1-post.handler
    description: Audited repair — clears the suppression entry AND the platform record — 037
    events:
      - httpApi:
          method: POST
          path: /admin/v1/deliverability/{address}/repair
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # Feedback console. Read: any active staff; reply: admin/manager.
  feedbackListV1:
    handler: src/functions/feedback-list-v1-get.handler
    description: List/search/filter feedback — any active staff (046 US2)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/feedback
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  feedbackDetailV1:
    handler: src/functions/feedback-detail-v1-get.handler
    description: One submission with its replies and internal notes — any active staff (046 US2)
    events:
      - httpApi:
          method: GET
          path: /admin/v1/feedback/{referenceCode}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  feedbackStatusV1:
    handler: src/functions/feedback-status-v1-post.handler
    description: Change a submission's triage status — any active staff (046 US2)
    events:
      - httpApi:
          method: POST
          path: /admin/v1/feedback/{referenceCode}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  feedbackNoteV1:
    handler: src/functions/feedback-note-v1-post.handler
    description: Add a staff-only internal note — any active staff (046 US2)
    events:
      - httpApi:
          method: POST
          path: /admin/v1/feedback/{referenceCode}/notes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  feedbackReplyV1:
    handler: src/functions/feedback-reply-v1-post.handler
    description: Reply to the submitter by email — admin/manager only (046 US3)
    events:
      - httpApi:
          method: POST
          path: /admin/v1/feedback/{referenceCode}/reply
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # Delivery coverage: the postcode list, its groups and courier reach.
  deliveryCoverageListV1:
    handler: src/functions/delivery-coverage-list-v1-get.handler
    description: The list of postcodes effy delivers to, its groups and courier reach — 076
    events:
      - httpApi:
          method: GET
          path: /admin/v1/delivery/coverage
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoveragePlacesV1:
    handler: src/functions/delivery-coverage-places-v1-get.handler
    description: Place search for the add dialog, one result per postcode — 076
    events:
      - httpApi:
          method: GET
          path: /admin/v1/delivery/coverage/places
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageCheckV1:
    handler: src/functions/delivery-coverage-check-v1-get.handler
    description: Who delivers to a postcode or place, and why — 076
    events:
      - httpApi:
          method: GET
          path: /admin/v1/delivery/coverage/check
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoveragePostcodesAddV1:
    handler: src/functions/delivery-coverage-postcodes-add-v1-post.handler
    description: List postcodes — 076
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/coverage/postcodes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoveragePostcodesPatchV1:
    handler: src/functions/delivery-coverage-postcodes-patch-v1-patch.handler
    description: Move postcodes between groups, or set one distance — 076
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/delivery/coverage/postcodes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoveragePostcodeRemoveV1:
    handler: src/functions/delivery-coverage-postcode-remove-v1-delete.handler
    description: Take a postcode off the list; placed orders are untouched — 076
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/delivery/coverage/postcodes/{postcode}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageGroupCreateV1:
    handler: src/functions/delivery-coverage-group-create-v1-post.handler
    description: Create a group — 076
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/coverage/groups
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageGroupPatchV1:
    handler: src/functions/delivery-coverage-group-patch-v1-patch.handler
    description: Rename a group — 076
    events:
      - httpApi:
          method: PATCH
          path: /admin/v1/delivery/coverage/groups/{groupId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageGroupRemoveV1:
    handler: src/functions/delivery-coverage-group-remove-v1-delete.handler
    description: Remove a group; its postcodes stay listed — 076
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/delivery/coverage/groups/{groupId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageCourierV1:
    handler: src/functions/delivery-coverage-courier-v1-put.handler
    description: Courier delivery on or off, its estimate and the no-window fallback — 076, 079
    events:
      - httpApi:
          method: PUT
          path: /admin/v1/delivery/coverage/courier
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCourierServicesListV1:
    handler: src/functions/delivery-courier-services-v1-get.handler
    description: The courier services Effy uses — 080
    events:
      - httpApi:
          method: GET
          path: /admin/v1/delivery/courier-services
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCourierServicesCreateV1:
    handler: src/functions/delivery-courier-services-v1-post.handler
    description: Add a courier service — 080
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/courier-services
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCourierServiceUpdateV1:
    handler: src/functions/delivery-courier-service-v1-put.handler
    description: Edit, retire or make default a courier service — 080
    events:
      - httpApi:
          method: PUT
          path: /admin/v1/delivery/courier-services/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageCourierExclusionAddV1:
    handler: src/functions/delivery-coverage-courier-exclusion-add-v1-post.handler
    description: Exclude a postcode from courier delivery — 076
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/coverage/courier/exclusions
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryCoverageCourierExclusionRemoveV1:
    handler: src/functions/delivery-coverage-courier-exclusion-remove-v1-delete.handler
    description: Offer courier delivery there again — 076
    events:
      - httpApi:
          method: DELETE
          path: /admin/v1/delivery/coverage/courier/exclusions/{postcode}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # Delivery pricing: one active fee plan per kind (Effy, courier).
  deliveryPlansListV1:
    handler: src/functions/delivery-plans-list-v1-get.handler
    description: List fee plans of a kind (effy | courier) with their gaps — 077
    events:
      - httpApi:
          method: GET
          path: /admin/v1/delivery/plans
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryPlansCreateV1:
    handler: src/functions/delivery-plans-create-v1-post.handler
    description: Create a draft fee plan — 077
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/plans
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryPlanUpdateV1:
    handler: src/functions/delivery-plan-update-v1-put.handler
    description: Replace a draft fee plan whole; refused once it has been active — 077
    events:
      - httpApi:
          method: PUT
          path: /admin/v1/delivery/plans/{planId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryPlanActivateV1:
    handler: src/functions/delivery-plan-activate-v1-post.handler
    description: Make a plan the one in force; refused with every gap named — 077
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/plans/{planId}/activate
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliveryPlansSimulateV1:
    handler: src/functions/delivery-plans-simulate-v1-post.handler
    description: Price a delivery under any plan and show every step; writes nothing — 077
    events:
      - httpApi:
          method: POST
          path: /admin/v1/delivery/plans/simulate
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  deliverySettingsGetV1:
    handler: src/functions/delivery-settings-get-v1-get.handler
    description: Read the operating hub + same-day prep buffer — 047
    events:
      - httpApi:
          method: GET
