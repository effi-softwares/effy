# Back-office product review: the queue, approve / send back, and Effy's margin. Staff gateway,
# back-office authorizer. Kept apart from the shop service so a shop can never approve itself.
service: effy-edge-catalog
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  versionFunctions: false
  tags:
    project: effy
    slice: 067-product-approval-margin
    service: catalog
  httpApi:
    id: ${ssm:/effy/${sls:stage}/staff/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # No default: a deploy before the live channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    # Reviewers see the shop's images, so this service presigns reads; staff upload category pictures (101).
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
    MEDIA_PUBLIC_BASE_URL: ${ssm:/effy/${sls:stage}/media/public_base_url}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
        - Effect: Allow
          Action: s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
        # Presigned PUTs of category pictures only (101).
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/categories/*
  layers:
    - ${param:secretsExtensionArn}

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the catalog service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /catalog/healthz

  taxonomyCategoriesListV1:
    handler: src/functions/taxonomy-categories-list-v1-get.handler
    description: The category tree, retired categories included, with counts and resolved defaults (101). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/taxonomy/categories
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoriesCreateV1:
    handler: src/functions/taxonomy-categories-create-v1-post.handler
    description: Add a category or sub-category (101). Admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/taxonomy/categories
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoriesUpdateV1:
    handler: src/functions/taxonomy-categories-update-v1-patch.handler
    description: Rename a category, set its icon, picture, synonyms or defaults (101). Admin/manager.
    events:
      - httpApi:
          method: PATCH
          path: /catalog/v1/taxonomy/categories/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoriesMoveV1:
    handler: src/functions/taxonomy-categories-move-v1-post.handler
    description: Move or reorder a category within the five levels (101). Admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/taxonomy/categories/{id}/move
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoriesStatusV1:
    handler: src/functions/taxonomy-categories-status-v1-post.handler
    description: Retire or restore a category (101). Admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/taxonomy/categories/{id}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoriesImageV1:
    handler: src/functions/taxonomy-categories-image-v1-post.handler
    description: A presigned upload for a category's picture (101). Admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/taxonomy/categories/{id}/image
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoryFormV1:
    handler: src/functions/taxonomy-category-form-v1-get.handler
    description: A category's resolved form with each row's source, and its own attachments (101). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/taxonomy/categories/{id}/form
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoryAttributePutV1:
    handler: src/functions/taxonomy-category-attribute-put-v1-put.handler
    description: Attach, tighten or hide an attribute on a category (101). Admin/manager.
    events:
      - httpApi:
          method: PUT
          path: /catalog/v1/taxonomy/categories/{id}/attributes/{attributeId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyCategoryAttributeDeleteV1:
    handler: src/functions/taxonomy-category-attribute-delete-v1-delete.handler
    description: Remove a category's own attachment (101). Admin/manager.
    events:
      - httpApi:
          method: DELETE
          path: /catalog/v1/taxonomy/categories/{id}/attributes/{attributeId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyAttributesListV1:
    handler: src/functions/taxonomy-attributes-list-v1-get.handler
    description: The attribute library with usage (101). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/taxonomy/attributes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyAttributesGetV1:
    handler: src/functions/taxonomy-attributes-get-v1-get.handler
    description: One attribute with its values and their usage (101). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/taxonomy/attributes/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyAttributesCreateV1:
    handler: src/functions/taxonomy-attributes-create-v1-post.handler
    description: Define an attribute in the library (101). Admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/taxonomy/attributes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyAttributesUpdateV1:
    handler: src/functions/taxonomy-attributes-update-v1-patch.handler
    description: Change an attribute and its values (101). Admin/manager.
    events:
      - httpApi:
          method: PATCH
          path: /catalog/v1/taxonomy/attributes/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  taxonomyAttributesStatusV1:
    handler: src/functions/taxonomy-attributes-status-v1-post.handler
    description: Retire or restore an attribute (101). Admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/taxonomy/attributes/{id}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  productPlacementsV1:
    handler: src/functions/product-placements-v1-put.handler
    description: Place a product in up to five extra leaves for browsing; replaces the list (101). Admin/manager.
    events:
      - httpApi:
          method: PUT
          path: /catalog/v1/products/{productId}/placements
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  productsMissingDetailsV1:
    handler: src/functions/products-missing-details-v1-get.handler
    description: Products on sale with a required detail empty (101). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/products/missing-details
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  reviewListV1:
    handler: src/functions/review-list-v1-get.handler
    description: The review queue — new products and pending changes, oldest first (067 FR-006). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/review
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  reviewMarginNotSetV1:
    handler: src/functions/review-margin-not-set-v1-get.handler
    description: Live products with no margin set (067 FR-008). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/review/margin-not-set
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  reviewItemV1:
    handler: src/functions/review-item-v1-get.handler
    description: One review item with its before/after (067 FR-009, FR-010). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /catalog/v1/review/items/{productId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  reviewApproveV1:
    handler: src/functions/review-approve-v1-post.handler
    description: Approve a new product or a pending change, setting the margin (067 FR-011, FR-028). Decide = admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/review/items/{productId}/approve
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  reviewSendBackV1:
    handler: src/functions/review-send-back-v1-post.handler
    description: Send a new product or a pending change back with a reason (067 FR-012). Decide = admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/review/items/{productId}/send-back
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  productMarginV1:
    handler: src/functions/product-margin-v1-post.handler
    description: Set or change Effy's margin on an approved product (067 FR-032). Decide = admin/manager.
    events:
      - httpApi:
          method: POST
          path: /catalog/v1/products/{productId}/margin
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  reviewQueueAge:
    handler: src/functions/review-queue-age-scheduled.handler
    description: Emits how long the oldest review item has waited (067) — an unwatched queue stops shops selling, silently.
    events:
      - schedule: rate(15 minutes)

resources: {}
