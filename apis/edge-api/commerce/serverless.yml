# edge-commerce — everything a signed-in shopper does with a basket or with money (070-retire-core-api).
#
# Attaches to the Terraform-owned shared HTTP API (shared-gateway.contract.md): NO API/stage/CORS/
# authorizers created here. Routes live under /commerce/. Authenticated routes use the
# Terraform-owned CUSTOMER JWT authorizer (by id from SSM) — a new ATTACHMENT to an existing
# authorizer, not a new pool (Principle IV).
#
# ⚠ THREE ROUTES HERE TAKE NO CUSTOMER CREDENTIAL, each for a stated reason (constitution Principle
# III requires it recorded; plan.md Complexity Tracking):
#   · POST /commerce/v1/cart/preview  — prices a GUEST's cart; writes nothing.
#   · GET  /commerce/v1/cart/policy   — the minimum spend and ceilings, the same for everyone.
#   · POST /commerce/v1/stripe/webhook — authenticated by the PROVIDER's signature over the raw body.
# They live here because they share the cart and payment code with the routes beside them.
# `config.contract.test.ts` names all three; a fourth unauthenticated route fails the build.
#
# ⚠ EVERY AUTHENTICATED FUNCTION CALLS `resolveCustomer` — the gateway proves the token, the
# platform's own record decides access (a barred or closing customer is refused). And EVERY function
# exports through `shopperHandler`. `functions.guard.test.ts` enforces both.
#
# ⚠ IT CONNECTS AS THE SHOPPER DATABASE ROLE, not the master user (research R4): a shopper burst is
# refused at the database and answered as a retryable 503, and staff services are untouched.
#
# ⚠ MONEY LOGIC IS NOT WRITTEN HERE. Payment finalisation, refunds and cancellation live in
# `@effy/edge-shared/payments`, which `orders` and `shop` call too. This service wires routes to it.
#
# Until 070 these routes were served by an always-on Go backend (`core-api`).
#
# Serverless 3.40.0 pinned (frozen v3; benign nodejs22.x schema warning).
service: effy-edge-commerce
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    # 🧑‍💻 CONFIRM the latest Parameters-and-Secrets extension layer version for the region.
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 512
  # The default. Functions that call the payment provider override it to 25 (research R8): below
  # the gateway's 30 s ceiling, above the client's 12 s patience, so a slow provider call finishes
  # its work and the client's retry finds it done instead of racing it.
  timeout: 10
  logRetentionInDays: 30
  versionFunctions: false
  tags:
    project: effy
    slice: 070-retire-core-api
    service: commerce
  # Attach to the shared HTTP API (A3). external id → no API/stage/CORS/authorizers here.
  httpApi:
    id: ${ssm:/effy/${sls:stage}/edge/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    METRIC_NAMESPACE: Effy/Commerce
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    # ⚠ The SHOPPER role and its own secret — never the master user (see the header).
    DB_USER: ${ssm:/effy/${sls:stage}/db/shopper_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/shopper_secret_arn}
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
    # ⚠ ARNs, never the secrets. The values are fetched at runtime through the secrets extension and
    # held in module memory only.
    STRIPE_SECRET_KEY_ARN: ${ssm:/effy/${sls:stage}/stripe/secret_key_arn}
    STRIPE_WEBHOOK_SECRET_ARN: ${ssm:/effy/${sls:stage}/stripe/webhook_secret_arn}
    # Publishable by definition — it ships in every client. Echoed in the intent response so a
    # client need not be rebuilt to change accounts. Empty until the operator publishes it.
    STRIPE_PUBLISHABLE_KEY: ${ssm:/effy/${sls:stage}/stripe/publishable_key, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            - ${ssm:/effy/${sls:stage}/db/shopper_secret_arn}
            - ${ssm:/effy/${sls:stage}/stripe/secret_key_arn}
            - ${ssm:/effy/${sls:stage}/stripe/webhook_secret_arn}
        # READ ONLY — cart, saved and order lines show product images.
        - Effect: Allow
          Action: s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
  layers:
    - ${param:secretsExtensionArn}
  # NO provider.vpc — functions run OUTSIDE the VPC (dev posture): no NAT means an in-VPC Lambda
  # cannot reach public AWS APIs or the payment provider. DEV ONLY — see infra/envs/README.md.

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the commerce service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /commerce/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the commerce service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /commerce/readyz
