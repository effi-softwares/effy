# Customer profile and account management, on the shared gateway under /customer/. The catalogue is
# `storefront`; cart, checkout, payment and orders are `commerce` (docs/api/path-assignment.md).
service: effy-edge-customer
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
    receiptResendWindowMinutes: "60"
    receiptResendMaxPerWindow: "3"
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  tags:
    project: effy
    slice: 011-customer-storefront-web
    service: customer
  httpApi:
    id: ${ssm:/effy/${sls:stage}/edge/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # No default: a deploy before the live channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    LIVE_REALTIME_HOST: ${ssm:/effy/${sls:stage}/live/realtime_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    CUSTOMER_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/customer/user_pool_id}
    # ConfirmForgotPassword is keyed on the app client id.
    CUSTOMER_APP_CLIENT_ID: ${ssm:/effy/${sls:stage}/auth/customer/app_client_id}
    # The sender comes from /effy/<env>/ses/*, never a literal.
    MAIL_SENDER: ${ssm:/effy/${sls:stage}/ses/sender}
    MAIL_REPLY_TO: ${ssm:/effy/${sls:stage}/ses/reply_to}
    # Internal audiences reply to the operational mailbox once set; empty falls back to the public address.
    MAIL_REPLY_TO_INTERNAL: ${ssm:/effy/${sls:stage}/ses/reply_to_internal, ''}
    MAIL_CONFIGURATION_SET: ${ssm:/effy/${sls:stage}/ses/configuration_set}
    MAIL_POSTAL_ADDRESS: ${ssm:/effy/${sls:stage}/mail/postal_address, ''}
    # Receipt resend rate limit: generous to a person, useless to a script.
    RECEIPT_RESEND_WINDOW_MINUTES: ${param:receiptResendWindowMinutes}
    RECEIPT_RESEND_MAX_PER_WINDOW: ${param:receiptResendMaxPerWindow}
    # Newsletter: every key the service reads (newsletter/config.contract.test.ts checks). The confirm
    # base URL is the storefront page, which calls the confirm route server-side.
    NEWSLETTER_CONFIRM_BASE_URL: ${ssm:/effy/${sls:stage}/web/site_url, 'http://localhost:3000'}/newsletter/confirm
    NEWSLETTER_TOKEN_TTL_HOURS: "24"
    NEWSLETTER_RESEND_COOLDOWN_MINUTES: "60"
    # Feedback: every key the service reads (feedback/config.contract.test.ts checks). The salt only keeps
    # the stored source key from being a raw IP; it is not a secret.
    FEEDBACK_RATE_WINDOW_MINUTES: "60"
    FEEDBACK_RATE_MAX: "5"
    FEEDBACK_SOURCE_SALT: ${ssm:/effy/${sls:stage}/feedback/source_salt, ''}
    # Auto-confirm in the pre-sign-up trigger: off (email-squatting risk). It never auto-verifies the email.
    AUTO_CONFIRM_SIGNUP: "false"
  iam:
    role:
      statements:
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}

        # Password and closure Cognito calls need no IAM (the customer's own access token). This is for the
        # notification email: the identity and the configuration set, never `*`.
        - Effect: Allow
          Action: ses:SendEmail
          Resource:
            - ${ssm:/effy/${sls:stage}/ses/identity_arn}
            - ${ssm:/effy/${sls:stage}/ses/configuration_set_arn}

        # Account linking: an administrative write on the customer pool ARN only.
        - Effect: Allow
          Action:
            - cognito-idp:ListUsers
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminLinkProviderForUser
          Resource: ${ssm:/effy/${sls:stage}/auth/customer/user_pool_arn}
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  liveV1:
    handler: src/functions/live-v1-get.handler
    description: Which live-update channel is this person's — read on sign-in and reconnect, never on a timer — 071
    events:
      - httpApi:
          method: GET
          path: /customer/v1/live
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the customer service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /customer/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the customer service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /customer/readyz

  customerMeV1:
    handler: src/functions/customer-me-v1-get.handler
    description: Record-backed customer identity read — JIT upsert + the platform record (011 FR-023)
    events:
      - httpApi:
          method: GET
          path: /customer/v1/me
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerMeV1Patch:
    handler: src/functions/customer-me-v1-patch.handler
    description: The customer maintains their own details — displayName ONLY (011 FR-026)
    events:
      - httpApi:
          method: PATCH
          path: /customer/v1/me
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # Address book

  # Points: balance and history on one route.
  customerPointsV1Get:
    handler: src/functions/customer-points-v1-get.handler
    description: The customer's points - balance, value, next expiry and a page of history (074 US1)
    events:
      - httpApi:
          method: GET
          path: /customer/v1/points
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerAddressesV1Get:
    handler: src/functions/customer-addresses-v1-get.handler
    description: List the customer's saved delivery addresses, default first (022 US1)
    events:
      - httpApi:
          method: GET
          path: /customer/v1/addresses
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerAddressesV1Post:
    handler: src/functions/customer-addresses-v1-post.handler
    description: Add a delivery address; first address auto-defaults (022 US2)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/addresses
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerAddressesV1IdPatch:
    handler: src/functions/customer-addresses-v1-id-patch.handler
    description: Edit an address and/or set it as default (022 US3/US5)
    events:
      - httpApi:
          method: PATCH
          path: /customer/v1/addresses/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerAddressesV1IdDelete:
    handler: src/functions/customer-addresses-v1-id-delete.handler
    description: Delete an address; the default-with-others delete is refused 409 (022 US4, FR-016a)
    events:
      - httpApi:
          method: DELETE
          path: /customer/v1/addresses/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # Feedback: an authenticated route (linked, verified email) and a public one for guests (unverified
  # email, rate-limited by source IP).
  customerFeedbackV1Post:
    handler: src/functions/feedback-submit-v1-post.handler
    description: Submit feedback (signed-in) — linked to the customer, trusted profile email (046 US1)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/feedback
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerFeedbackPublicV1Post:
    handler: src/functions/feedback-submit-public-v1-post.handler
    description: PUBLIC — submit feedback (guest); unverified email, IP-keyed rate limit (046 US1)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/feedback/public

  # Password and sessions

  # Sends the step-up code for setting a first password; it grants nothing on its own.
  customerPasswordV1Challenge:
    handler: src/functions/customer-password-v1-challenge.handler
    description: Step-up — email a single-purpose code before a FIRST password may be set (012 FR-017)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/password/challenge
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # `mode: set` verifies a freshly emailed code immediately before writing the password, in the same request.
  customerPasswordV1Put:
    handler: src/functions/customer-password-v1-put.handler
    description: Set (step-up gated) or change (current-password gated) the password (012 FR-016/FR-017)
    events:
      - httpApi:
          method: PUT
          path: /customer/v1/password
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerSessionsV1Delete:
    handler: src/functions/customer-sessions-v1-delete.handler
    description: Sign out on all devices — the remedy for a hotel PC or a lost phone (012 FR-032)
    events:
      - httpApi:
          method: DELETE
          path: /customer/v1/sessions
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # Account closure. No new IAM: every Cognito call is token-authorized. Store rules require in-app
  # deletion and (Google Play) a public web URL, which lives in customer-web.

  customerClosureV1Get:
    handler: src/functions/customer-closure-v1-get.handler
    description: What deleting this account will do — blockers, retained data, erase date (034 FR-040/FR-042)
    events:
      - httpApi:
          method: GET
          path: /customer/v1/closure
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # The step-up code for closing an account, keyed on the verified email (works for Google-only customers).
  customerClosureV1Challenge:
    handler: src/functions/customer-closure-v1-challenge.handler
    description: Step-up — email a single-purpose code before an account may be closed (034 FR-043)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/closure/challenge
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # Verifies the code and closes the account, then revokes every session; erasure follows with no human step.
  # Receipt resend: no body (the recipient is the account's), and it only enqueues.
  customerOrdersV1IDReceiptPost:
    handler: src/functions/customer-orders-v1-id-receipt-post.handler
    description: Enqueue a resend of a paid order's receipt to the account address (052 US4)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/orders/{id}/receipt
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerClosureV1Post:
    handler: src/functions/customer-closure-v1-post.handler
    description: Close the account — verifies a fresh code, then closes and revokes all sessions (034 US3)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/closure
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # The one way back from `closing`, and an explicit call.
  customerClosureV1Restore:
    handler: src/functions/customer-closure-v1-restore.handler
    description: Cancel a pending deletion during the grace window (034 FR-041a)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/closure/restore
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # Public: recovery has no session; the caller proves the inbox, and the wrapped API needs no IAM.
  customerPasswordResetConfirm:
    handler: src/functions/customer-password-reset-confirm.handler
    description: PUBLIC — complete "forgot password"; screens the new password + records the state (012 FR-022b)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/password/reset-confirm

  # Newsletter: both public. No per-route throttle: HTTP API throttling is a stage setting owned by
  # Terraform; the cooldown is per address, in SQL.
  customerNewsletterV1Post:
    handler: src/functions/customer-newsletter-v1-post.handler
    description: PUBLIC — subscribe to Effy updates; uniform, non-enumerating response (039 FR-030/FR-032)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/newsletter

  customerNewsletterV1Confirm:
    handler: src/functions/customer-newsletter-v1-confirm-get.handler
    description: PUBLIC — double opt-in confirm; single-use, TTL-bounded token (039 FR-031)
    events:
      - httpApi:
          method: GET
          path: /customer/v1/newsletter/confirm

  # A Cognito trigger, not a route (wired in auth-customer.tf): links Google sign-ins to the native
  # profile, refusing unverified emails (src/lib/account-linking.ts).
  preSignUp:
    handler: src/functions/pre-sign-up.handler
    description: Cognito pre-sign-up — links a federated identity into the NATIVE profile (011 FR-011/FR-012)

  customerDevicesV1Post:
    handler: src/functions/customer-devices-v1-post.handler
    description: Register/refresh this device's FCM push token for the signed-in customer (050)
    events:
      - httpApi:
          method: POST
          path: /customer/v1/devices
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  customerDevicesV1IdDelete:
    handler: src/functions/customer-devices-v1-id-delete.handler
    description: Unregister a device token (sign-out / shared-device safety); only the caller's own (050 FR-020)
    events:
      - httpApi:
          method: DELETE
          path: /customer/v1/devices/{token}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/customer_id}

  # Points housekeeping: scheduled, not routes.

  # Writes "Expired" history lines and the warning; expiry itself does not depend on it.
  pointsExpiry:
    handler: src/functions/points-expiry-scheduled.handler
    description: Daily — record expired points in customers' history and queue expiry warnings (074 US4).
    timeout: 120
    events:
      - schedule:
          rate: rate(1 day)

  # Checks the ledger adds up, reporting the count every run, zero included.
  pointsReconcile:
    handler: src/functions/points-reconcile-scheduled.handler
    description: Hourly — check the points ledger's invariants and report violations (074 SC-001).
    timeout: 60
    events:
      - schedule:
          rate: rate(1 hour)
