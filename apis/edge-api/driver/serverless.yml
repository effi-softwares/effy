# Driver routes on the shared gateway, under /driver/, behind the driver JWT authorizer.
service: effy-edge-driver
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  tags:
    project: effy
    slice: 049-driver-mobile-app
    service: driver
  httpApi:
    id: ${ssm:/effy/${sls:stage}/edge/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # No default: a deploy before the live channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    LIVE_REALTIME_HOST: ${ssm:/effy/${sls:stage}/live/realtime_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    # Proof media under `proof/` in the shared media bucket, which the Terraform lifecycle rule archives.
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
        # Presigned PUT and GET for proof, on the bucket's objects only (no listing).
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc: without NAT an in-VPC Lambda cannot reach AWS APIs (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  liveV1:
    handler: src/functions/live-v1-get.handler
    description: Which live-update channel is this person's — read on sign-in and reconnect, never on a timer — 071
    events:
      - httpApi:
          method: GET
          path: /driver/v1/live
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the driver service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /driver/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the driver service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /driver/readyz

  driverTodayV1:
    handler: src/functions/driver-today-v1-get.handler
    description: >-
      063 — what this driver should be doing now. ⚠ RESTORED, NOT NEW: HttpTodayRepository has been
      calling this since 060 and getting a 404, because the teardown removed the work model and its
      whole API surface while the app's client code stayed intact.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/today
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverCollectionRunV1:
    handler: src/functions/driver-collection-run-v1-get.handler
    description: 063 — the shops on this driver's collection round, ordered by the shared rule.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/collection/runs/{runId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverCollectionStopV1:
    handler: src/functions/driver-collection-stop-v1-get.handler
    description: 063 — the manifest for one shop on a collection round, with the shop's address.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/collection/runs/{runId}/stops/{stopId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDeliveryRunV1:
    handler: src/functions/driver-delivery-run-v1-get.handler
    description: 063 — this driver's same-day delivery round.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/delivery/runs/{runId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverCollectV1:
    handler: src/functions/driver-collect-v1-post.handler
    description: 063 — collect a shop's packages, with each package's own outcome. Idempotent by stop state.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/collection/runs/{runId}/stops/{stopId}/collect
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverHubCheckinV1:
    handler: src/functions/driver-hub-checkin-v1-post.handler
    description: >-
      063 — hub check-in. Shows the same-day/standard split the shopper already chose at checkout; the
      driver classifies nothing, and a standard package's driver-side work ends here.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/hub/checkin
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDropV1:
    handler: src/functions/driver-drop-v1-get.handler
    description: 063 — one customer stop on a delivery round.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/delivery/drops/{dropId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDropStatusV1:
    handler: src/functions/driver-drop-status-v1-post.handler
    description: 063 - progress a drop to en_route/arrived. Completion is the 064 proof route.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/delivery/drops/{dropId}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  # Proof of delivery
  driverDropProofPresignV1:
    handler: src/functions/driver-drop-proof-presign-v1-post.handler
    description: 064 - mint a presigned PUT for proof media under the proof/ prefix.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/delivery/drops/{dropId}/proof/presign
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDropProofV1:
    handler: src/functions/driver-drop-proof-v1-post.handler
    description: 064 - complete a drop with proof. This route IS the delivery completion.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/delivery/drops/{dropId}/proof
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDropFailV1:
    handler: src/functions/driver-drop-fail-v1-post.handler
    description: 064 - record a drop that could not be completed. Never marks anything delivered.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/delivery/drops/{dropId}/fail
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDeliveryReturnV1:
    handler: src/functions/driver-delivery-return-v1-post.handler
    description: 088 - return the parcels from a run's failed drops to the hub, all together.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/delivery/runs/{runId}/return
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDeliveryLoadV1:
    handler: src/functions/driver-delivery-load-v1-post.handler
    description: 090 - the van is loaded; every staged drop on the run goes out for delivery together.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/delivery/runs/{runId}/load
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverHistoryV1:
    handler: src/functions/driver-history-v1-get.handler
    description: 063 — finished rounds by local day. ⚠ Thin until Slice D captures proof.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/history
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverHistoryDetailV1:
    handler: src/functions/driver-history-detail-v1-get.handler
    description: 063 — one finished item.
    events:
      - httpApi:
          method: GET
          path: /driver/v1/history/{kind}/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverMeV1:
    handler: src/functions/driver-me-v1-get.handler
    description: Driver identity read — the provisioned driver record; refuses if absent/disabled (049).
    events:
      - httpApi:
          method: GET
          path: /driver/v1/me
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDutyV1:
    handler: src/functions/driver-duty-v1-post.handler
    description: Go on/off duty — opens/closes a duty session; gates assignment (049).
    events:
      - httpApi:
          method: POST
          path: /driver/v1/duty
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverVehicleCheckV1:
    handler: src/functions/driver-vehicle-check-v1-post.handler
    description: 093 — the driver's daily check of the vehicle they hold; an unsafe answer means no work until dispatch clears it.
    events:
      - httpApi:
          method: POST
          path: /driver/v1/vehicle-check
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDevicesV1Post:
    handler: src/functions/driver-devices-v1-post.handler
    description: Register/refresh this device's FCM push token for the signed-in driver (050)
    events:
      - httpApi:
          method: POST
          path: /driver/v1/devices
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}

  driverDevicesV1IdDelete:
    handler: src/functions/driver-devices-v1-id-delete.handler
    description: Unregister a device token (sign-out / shared-device safety); only the caller's own (050 FR-020)
    events:
      - httpApi:
          method: DELETE
          path: /driver/v1/devices/{token}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/driver_id}
