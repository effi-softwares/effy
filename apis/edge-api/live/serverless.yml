# The live channel's authorizer (AppSync Events calls it directly; no route). One function for all
# four pools: it pins each issuer and refuses any subscription outside the token's own audience.
# Deploy before the Terraform that creates the channel. live.tf looks the function up by name.
service: effy-edge-live
frameworkVersion: "3"

plugins:
  - serverless-esbuild

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  # The channel allows 10 s; a dead database must fail first as our refusal.
  timeout: 8
  logRetentionInDays: 30
  versionFunctions: false
  tags:
    project: effy
    slice: 071-live-updates
    service: live
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    # The same pools and clients the gateway's authorizers use.
    CUSTOMER_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/customer/user_pool_id}
    CUSTOMER_CLIENT_IDS: ${ssm:/effy/${sls:stage}/auth/customer/app_client_id},${ssm:/effy/${sls:stage}/auth/customer/mobile_app_client_id}
    SHOP_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_id}
    SHOP_CLIENT_IDS: ${ssm:/effy/${sls:stage}/auth/shop/app_client_id}
    DRIVER_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/driver/user_pool_id}
    DRIVER_CLIENT_IDS: ${ssm:/effy/${sls:stage}/auth/driver/app_client_id},${ssm:/effy/${sls:stage}/auth/driver/mobile_app_client_id}
    BACK_OFFICE_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/back-office/user_pool_id}
    BACK_OFFICE_CLIENT_IDS: ${ssm:/effy/${sls:stage}/auth/back-office/app_client_id}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
  layers:
    - ${param:secretsExtensionArn}

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  authorizer:
    handler: src/functions/authorizer.handler
    description: May this person open the live channel, and may they hear this channel? (071 FR-017..023). Invoked by the channel, not by HTTP.
