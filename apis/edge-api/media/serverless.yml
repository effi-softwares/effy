# Effy MEDIA worker — 086-catalogue-image-delivery.
#
# Makes the smaller WebP copies of every catalogue and promotion picture, once, when it is uploaded,
# and records which exist in public.media_rendition (its ONE writer).
#
# ⚠ NO HTTP ROUTE, AND NO GATEWAY. Uploads are presigned PUTs no Lambda observes, so the bucket is the
# only place that knows a picture arrived: it notifies a queue (infra/envs/<env>/media.tf), and
# `render` reads that queue. Neither gateway's integration count changes (the `live` precedent).
#
# ⚠ DEPLOY ORDER: the Terraform that creates the queue first (this file reads its ARN and URL from
# SSM), then the migration (the table), then this service.
#
# ⚠ THE FUNCTION NAME IS A CONTRACT with background-functions.tf, which alarms on
# `effy-edge-media-<env>-render`. Rename both together.
service: effy-edge-media
frameworkVersion: "3"

plugins:
  - serverless-esbuild

params:
  default:
    logLevel: info
    # Region-pinned AWS layer (Decisions locked: changed by hand on a region move).
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 2048 # sharp's speed scales with the CPU this buys
  timeout: 60
  logRetentionInDays: 30
  versionFunctions: false
  tags:
    project: effy
    slice: 086-catalogue-image-delivery
    service: media
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    METRIC_NAMESPACE: Effy/Media
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
        # Read originals — the two public ORIGINAL prefixes only. Never proof/ or courier-label/.
        - Effect: Allow
          Action: s3:GetObject
          Resource:
            - arn:aws:s3:::${ssm:/effy/${sls:stage}/media/bucket}/products/*
            - arn:aws:s3:::${ssm:/effy/${sls:stage}/media/bucket}/promotions/*
        # Write copies — renditions/ ONLY, which the bucket never notifies (no loop).
        - Effect: Allow
          Action: s3:PutObject
          Resource: arn:aws:s3:::${ssm:/effy/${sls:stage}/media/bucket}/renditions/*
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: ${ssm:/effy/${sls:stage}/media/rendition_queue_arn}
  layers:
    - ${param:secretsExtensionArn}

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    # ⚠ sharp is a NATIVE module: it cannot be bundled, and the binary must be Lambda's (linux, arm64,
    # glibc), not the laptop's. Installed for that target at package time from prebuilt binaries
    # (research R11). The version MUST match package.json's.
    external:
      - sharp
    packager: npm
    packagerOptions:
      scripts:
        - npm install --no-save --os=linux --cpu=arm64 --libc=glibc sharp@0.34.5

package:
  individually: true

functions:
  render:
    handler: src/functions/render.handler
    description: Make the smaller WebP copies of one uploaded catalogue or promotion picture, and record them (086).
    events:
      - sqs:
          arn: ${ssm:/effy/${sls:stage}/media/rendition_queue_arn}
          # ONE picture per invocation: a bad picture must never fail its neighbours.
          batchSize: 1
