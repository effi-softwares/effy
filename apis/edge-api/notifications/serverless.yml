# Scheduled workers that drain public.notification_request (push via FCM, plus email) and
# public.receipt_dispatch. Attaches to the shared HTTP API for healthz only.
service: effy-edge-notifications
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
    # rate(1 minute) is EventBridge's floor.
    drainSchedule: rate(1 minute)
    notifMaxAttempts: "5"
    notifBatchSize: "100"
    receiptMaxAttempts: "5"
    receiptBatchSize: "50"
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 512
  timeout: 60
  logRetentionInDays: 30
  tags:
    project: effy
    slice: 050-observability-push-foundation
    service: notifications
  httpApi:
    id: ${ssm:/effy/${sls:stage}/edge/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    # Only the service-account secret's ARN; unset, the worker fails open and leaves rows pending.
    FCM_SERVICE_ACCOUNT_ARN: ${ssm:/effy/${sls:stage}/notifications/fcm_service_account_arn}
    FCM_PROJECT_ID: ${ssm:/effy/${sls:stage}/notifications/fcm_project_id}
    # Every key in email-kit's MAIL_ENV_KEYS must be declared (config.contract.test.ts checks).
    MAIL_SENDER: ${ssm:/effy/${sls:stage}/ses/sender}
    MAIL_REPLY_TO: ${ssm:/effy/${sls:stage}/ses/reply_to}
    MAIL_REPLY_TO_INTERNAL: ${ssm:/effy/${sls:stage}/ses/reply_to_internal, ''}
    MAIL_CONFIGURATION_SET: ${ssm:/effy/${sls:stage}/ses/configuration_set}
    MAIL_POSTAL_ADDRESS: ${ssm:/effy/${sls:stage}/mail/postal_address, ''}
    WEB_SITE_URL: ${ssm:/effy/${sls:stage}/web/site_url, ''}
    # Drain tuning. The code has defaults, but the deployment states what it runs with.
    NOTIF_MAX_ATTEMPTS: ${param:notifMaxAttempts}
    NOTIF_BATCH_SIZE: ${param:notifBatchSize}
    RECEIPT_MAX_ATTEMPTS: ${param:receiptMaxAttempts}
    RECEIPT_BATCH_SIZE: ${param:receiptBatchSize}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            - ${ssm:/effy/${sls:stage}/db/master_secret_arn}
            - ${ssm:/effy/${sls:stage}/notifications/fcm_service_account_arn}
        # Both the identity and the configuration set: every send names one, so the identity alone is denied.
        - Effect: Allow
          Action: ses:SendEmail
          Resource:
            - ${ssm:/effy/${sls:stage}/ses/identity_arn}
            - ${ssm:/effy/${sls:stage}/ses/configuration_set_arn}
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc: without NAT an in-VPC Lambda cannot reach AWS APIs or FCM (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness - is the notifications service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /notifications/healthz

  # The receipt drain: its own outbox and schedule; receipts can be re-sent, pushes cannot.
  receiptDrain:
    handler: src/receipts/handler.handler
    description: Drain public.receipt_dispatch → render the order receipt → send via SES; mark sent/skipped/failed (052).
    timeout: 60
    events:
      - schedule: ${param:drainSchedule}

  drain:
    handler: src/worker/handler.handler
    description: Drain public.notification_request → resolve device tokens → send via FCM → mark sent/skipped/failed; prune dead tokens (050).
    timeout: 60
    events:
      - schedule: ${param:drainSchedule}
