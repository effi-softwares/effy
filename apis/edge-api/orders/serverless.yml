# edge-orders — Effy orders service (053-order-lifecycle-completion).
#
# Attaches to the Terraform-owned STAFF HTTP API (075; docs/api/shared-gateway.md): NO API/stage/
# CORS/authorizers created here (those live in infra/envs/<env>/staff-gateway.tf). Routes live
# under /orders/. Authenticated routes use the Terraform-owned BACK-OFFICE JWT authorizer (by id
# from SSM) — this is a new ATTACHMENT to an existing authorizer, not a new pool (Principle IV).
#
# ⚠ WHY THIS IS ITS OWN SERVICE AND NOT A DOMAIN INSIDE edge-admin (research R7, measured in T001):
# `effy-edge-admin` packages to 434 of CloudFormation's 500 resources. A route costs ~5 (log group +
# function + permission + integration + route). These routes would land admin at ~465 — about one
# more feature of runway, in the domain where refunds, cancellation and returns are all queued next.
# The cheap mitigation is already spent: admin carries `versionFunctions: false`, which 049 was
# forced to add when the driver routes hit the ceiling. A3's decomposition exists for exactly this.
#
# Serverless 3.40.0 pinned (frozen v3; benign nodejs22.x schema warning).
service: effy-edge-orders
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    # 🧑‍💻 CONFIRM the latest Parameters-and-Secrets extension layer version for the region.
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  # ⚠ Set from the START, not when it is needed. admin reached the CFN limit before anyone noticed
  # and had to add this under pressure (049). Nothing here publishes aliases or uses provisioned
  # concurrency, and every httpApi integration invokes the unqualified ($LATEST) ARN, so per-deploy
  # Versions are dead weight from the first deploy onward.
  versionFunctions: false
  tags:
    project: effy
    slice: 053-order-lifecycle-completion
    service: orders
  # Attach to the STAFF HTTP API (075). external id → no API/stage/CORS/authorizers here.
  httpApi:
    id: ${ssm:/effy/${sls:stage}/staff/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # 071 — the live-update channel. Published to after a change commits; named in the handshake an
    # app makes. No default: a service deployed before the channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    # 070 — back-office refunds and cancellation are issued HERE now. ⚠ The ARN, never the secret:
    # the value is fetched at runtime through the secrets extension. ⚠ The SECRET KEY ONLY — this
    # service verifies no webhook, so it is not granted the webhook signing secret.
    STRIPE_SECRET_KEY_ARN: ${ssm:/effy/${sls:stage}/stripe/secret_key_arn}
    # 080 — courier labels: uploaded by staff under courier-label/, read through presigned URLs only.
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
  iam:
    role:
      statements:
        # 071 — publish live updates, to this environment's channel only.
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        # 080 — courier labels, and nothing else in the media bucket.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/courier-label/*
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            - ${ssm:/effy/${sls:stage}/db/master_secret_arn}
            - ${ssm:/effy/${sls:stage}/stripe/secret_key_arn}
  layers:
    - ${param:secretsExtensionArn}
  # NO provider.vpc — functions run OUTSIDE the VPC (dev posture), same rationale as
  # edge-shop/admin/driver: no NAT means an in-VPC Lambda cannot reach public AWS APIs, and the dev
  # DB is reachable on its public endpoint. DEV ONLY — see infra/envs/README.md.

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the orders service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /orders/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the orders service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /orders/readyz

  ordersListV1:
    handler: src/functions/orders-v1-get.handler
    description: Back-office order list/search — by reference or customer, filterable by status and by what the order is awaiting (053 US1). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/orders
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  orderDetailV1:
    handler: src/functions/order-v1-get.handler
    description: Back-office order detail — progress, packages, items, payment, destination and a chronological history (053 US1). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/orders/{orderId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  refundProposalDismissV1:
    handler: src/functions/refund-proposal-dismiss-v1-post.handler
    description: Back-office — dismiss a proposed refund a shortfall implied (055 FR-004b). No money moves; write = admin|manager, the same gate as issuing.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/orders/{orderId}/proposals/{orderItemId}/dismiss
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # ── 070: money. Until 070 these three ran on the Go backend, because it alone held the payment
  #    secret. The rules are @effy/edge-shared/payments; these are the back-office's routes into them.
  #    timeout 25 on the two that call the payment provider (research R8).

  orderRefundV1:
    handler: src/functions/order-refund-v1-post.handler
    description: Back-office — issue a refund (item-derived or goodwill). Recorded under the ceiling lock, then submitted. Write = admin|manager.
    timeout: 25
    events:
      - httpApi:
          method: POST
          path: /orders/v1/orders/{orderId}/refunds
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  orderCancelV1:
    handler: src/functions/order-cancel-v1-post.handler
    description: Back-office — cancel an order that has not left the shop and refund what remains. Write = admin|manager.
    timeout: 25
    events:
      - httpApi:
          method: POST
          path: /orders/v1/orders/{orderId}/cancel
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  refundRequestDeclineV1:
    handler: src/functions/refund-request-decline-v1-post.handler
    description: Back-office — decline a customer's refund request. No money moves; write = admin|manager, the same gate as issuing.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/refund-requests/{requestId}/decline
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  handoversListV1:
    handler: src/functions/handovers-v1-get.handler
    description: Standard packages due to be handed to the carrier, by due day (069 US7). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/handovers
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  fulfillmentHandoffV1:
    handler: src/functions/fulfillment-handoff-v1-post.handler
    description: Record a standard package's handover to an outside carrier (053 US2, FR-002). Write = admin/manager only.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/fulfillments/{fulfillmentId}/handoff
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  fulfillmentConsignmentV1:
    handler: src/functions/fulfillment-consignment-v1-put.handler
    description: Book or edit a courier consignment (080). Write = admin/manager.
    events:
      - httpApi:
          method: PUT
          path: /orders/v1/fulfillments/{fulfillmentId}/consignment
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  fulfillmentConsignmentEventsV1:
    handler: src/functions/fulfillment-consignment-events-v1-post.handler
    description: Record a courier consignment step (080). Write = admin/manager.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/fulfillments/{fulfillmentId}/consignment/events
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  fulfillmentConsignmentLabelV1:
    handler: src/functions/fulfillment-consignment-label-v1-post.handler
    description: Presigned upload for a courier label (080). Write = admin/manager.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/fulfillments/{fulfillmentId}/consignment/label
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  orderCourierCollectionV1:
    handler: src/functions/order-courier-collection-v1-put.handler
    description: Change how a courier order reaches the courier (080). Write = admin/manager.
    events:
      - httpApi:
          method: PUT
          path: /orders/v1/orders/{orderId}/courier-collection
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  fulfillmentArrivalV1:
    handler: src/functions/fulfillment-arrival-v1-post.handler
    description: Record that a handed-over package arrived; completes the order when it is the last one (053 US2, FR-004). Write = admin/manager only.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/fulfillments/{fulfillmentId}/arrival
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # ── 074: customers and their points. Every rule is @effy/edge-shared/points; these are the
  #    back-office's routes into it.

  customersV1:
    handler: src/functions/customers-v1-get.handler
    description: Back-office — find a customer by order number or email (074). Read = any active staff incl. csa.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/customers
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  customerDetailV1:
    handler: src/functions/customer-v1-get.handler
    description: Back-office — a customer, their points and recent orders (074). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/customers/{customerId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  customerPointsHistoryV1:
    handler: src/functions/customer-points-history-v1-get.handler
    description: Back-office — a customer's points history with reasons, notes and authors (074). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/customers/{customerId}/points/history
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  customerPointsCreditV1:
    handler: src/functions/customer-points-credit-v1-post.handler
    description: Back-office — credit points with a reason (074 US1). Any active staff; a csa is held to the per-credit limit.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/customers/{customerId}/points/credit
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  customerPointsDebitV1:
    handler: src/functions/customer-points-debit-v1-post.handler
    description: Back-office — debit points to correct a balance (074 US5). Write = admin|manager.
    events:
      - httpApi:
          method: POST
          path: /orders/v1/customers/{customerId}/points/debit
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  pointsSettingsV1:
    handler: src/functions/points-settings-v1-get.handler
    description: Back-office — the points rules and their change log (074 US6). Read = any active staff.
    events:
      - httpApi:
          method: GET
          path: /orders/v1/points/settings
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  pointsSettingsUpdateV1:
    handler: src/functions/points-settings-v1-put.handler
    description: Back-office — change the points rules (074 US6). Admin only; every change audited.
    events:
      - httpApi:
          method: PUT
          path: /orders/v1/points/settings
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/staff/authorizer/back-office_id}

  # ── 080 — courier parcels that are late, by where they are ─────────────────────────────────────
  courierLateSweep:
    handler: src/functions/courier-late-sweep.handler
    description: Counts courier parcels late at the hub, at a supplier, or with the courier (080) — emits CourierParcelsLate {where}.
    events:
      - schedule: rate(30 minutes)
