# Shop routes on the shared gateway, under /shop/, behind the shop authorizer.
service: effy-edge-shop
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 30
  tags:
    project: effy
    slice: 004-backend-bootstrap
    service: shop
  httpApi:
    id: ${ssm:/effy/${sls:stage}/edge/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    # No default: a deploy before the live channel exists must fail, not go quiet.
    LIVE_HTTP_HOST: ${ssm:/effy/${sls:stage}/live/http_host}
    LIVE_REALTIME_HOST: ${ssm:/effy/${sls:stage}/live/realtime_host}
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/master_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/master_secret_arn}
    S3_MEDIA_BUCKET: ${ssm:/effy/${sls:stage}/media/bucket}
    # Team management provisions colleagues on the shop pool.
    SHOP_USER_POOL_ID: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_id}
    # The Stripe secret key's ARN only, for shop-manager refunds; no webhook is verified here.
    STRIPE_SECRET_KEY_ARN: ${ssm:/effy/${sls:stage}/stripe/secret_key_arn}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: appsync:EventPublish
          Resource: ${ssm:/effy/${sls:stage}/live/api_arn}/channelNamespace/*
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            - ${ssm:/effy/${sls:stage}/db/master_secret_arn}
            - ${ssm:/effy/${sls:stage}/stripe/secret_key_arn}
        # Product media objects only: presigned URLs inherit this identity's authority.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::effy-${sls:stage}-product-media/*
        # Admin Cognito actions for team management, on the shop pool only; the service re-checks shop_manager
        # first. No AdminDeleteUser: erasing an identity would orphan the audit rows naming it.
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
          Resource: ${ssm:/effy/${sls:stage}/auth/shop/user_pool_arn}
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc: without NAT an in-VPC Lambda cannot reach AWS APIs (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  # Two probes: a combined one cannot tell "not deployed" from "database down".
  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the shop service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /shop/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the shop service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /shop/readyz

  shopMeV1:
    handler: src/functions/shop-me-v1-get.handler
    description: Shop-identity read — records (JIT upsert) + returns the platform record (007)
    events:
      - httpApi:
          method: GET
          path: /shop/v1/me
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # Product catalog: any active shop member, every query shop-scoped.
  catalogSchemaV1:
    handler: src/functions/catalog-schema-v1-get.handler
    description: Catalog schema-read — active types + attributes + category tree (drives the create form) — 016
    events:
      - httpApi:
          method: GET
          path: /shop/v1/catalog/schema
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productsListV1:
    handler: src/functions/products-list-v1-get.handler
    description: List products — backend search/filter/sort/pagination, shop-scoped (SC-004) — 016
    events:
      - httpApi:
          method: GET
          path: /shop/v1/products
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productGetV1:
    handler: src/functions/product-get-v1-get.handler
    description: Product detail, shop-scoped — 016
    events:
      - httpApi:
          method: GET
          path: /shop/v1/products/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productCreateV1:
    handler: src/functions/product-create-v1-post.handler
    description: Create a shop-owned product (draft) — 016
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productMediaCreateV1:
    handler: src/functions/product-media-create-v1-post.handler
    description: Presign a direct-to-S3 image upload — 016
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products/{id}/media
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productMediaRegisterV1:
    handler: src/functions/product-media-register-v1-post.handler
    description: Register an uploaded image object — 016
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products/{id}/media/register
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productUpdateV1:
    handler: src/functions/product-update-v1-patch.handler
    description: Focused edit with optimistic concurrency (FR-023a) — 016
    events:
      - httpApi:
          method: PATCH
          path: /shop/v1/products/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # Review: approve, send back and margin live in `catalog`, behind the back-office authorizer.
  productSubmitV1:
    handler: src/functions/product-submit-v1-post.handler
    description: Submit a never-approved product for Effy's review — 067
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products/{id}/submit
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productWithdrawV1:
    handler: src/functions/product-withdraw-v1-post.handler
    description: Withdraw a submission, or discard a pending change — 067
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products/{id}/withdraw
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productStatusV1:
    handler: src/functions/product-status-v1-post.handler
    description: Change product lifecycle status (publish re-validates mandatory) — 016
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products/{id}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productVariantStateV1:
    handler: src/functions/product-variant-state-v1-post.handler
    description: Put one variant on or off sale, or remove it — immediate, never reviewed — 098
    events:
      - httpApi:
          method: POST
          path: /shop/v1/products/{id}/variants/{variantId}/state
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productDeleteV1:
    handler: src/functions/product-delete-v1-delete.handler
    description: Hard-delete an unreferenced draft (else 409, archive) — 016
    events:
      - httpApi:
          method: DELETE
          path: /shop/v1/products/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productSectionsV1:
    handler: src/functions/product-sections-v1-patch.handler
    description: Set a product's section membership — 016
    events:
      - httpApi:
          method: PATCH
          path: /shop/v1/products/{id}/sections
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productMediaPatchV1:
    handler: src/functions/product-media-patch-v1-patch.handler
    description: Reorder / set primary / alt text on a media object — 016
    events:
      - httpApi:
          method: PATCH
          path: /shop/v1/products/{id}/media/{mediaId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  productMediaDeleteV1:
    handler: src/functions/product-media-delete-v1-delete.handler
    description: Delete a media object (active product keeps a primary) — 016
    events:
      - httpApi:
          method: DELETE
          path: /shop/v1/products/{id}/media/{mediaId}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  sectionsListV1:
    handler: src/functions/sections-list-v1-get.handler
    description: List this shop's sections — 016
    events:
      - httpApi:
          method: GET
          path: /shop/v1/sections
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  sectionCreateV1:
    handler: src/functions/sections-create-v1-post.handler
    description: Create a shop section — 016
    events:
      - httpApi:
          method: POST
          path: /shop/v1/sections
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  sectionUpdateV1:
    handler: src/functions/sections-update-v1-patch.handler
    description: Rename / reorder a section — 016
    events:
      - httpApi:
          method: PATCH
          path: /shop/v1/sections/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  sectionDeleteV1:
    handler: src/functions/sections-delete-v1-delete.handler
    description: Delete a section — 016
    events:
      - httpApi:
          method: DELETE
          path: /shop/v1/sections/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # Order fulfilment: any active shop member (both roles), scoped to the caller's own shop.
  fulfillmentsListV1:
    handler: src/functions/fulfillments-list-v1-get.handler
    description: The shop's order queue — promise-ordered, shop-scoped (SC-002) — 020
    events:
      - httpApi:
          method: GET
          path: /shop/v1/fulfillments
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  fulfillmentGetV1:
    handler: src/functions/fulfillment-get-v1-get.handler
    description: Pick screen — this shop's lines only, no payment data; acknowledges on first open — 020
    events:
      - httpApi:
          method: GET
          path: /shop/v1/fulfillments/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  fulfillmentStatusV1:
    handler: src/functions/fulfillment-status-v1-post.handler
    description: Advance or reverse a portion — guarded, concurrency-safe (FR-014, SC-005) — 020
    events:
      - httpApi:
          method: POST
          path: /shop/v1/fulfillments/{id}/status
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  fulfillmentCourierHandoverV1:
    handler: src/functions/fulfillment-courier-handover-v1-post.handler
    description: The courier collected this parcel from the shop — own shop, booked pickups only — 080
    events:
      - httpApi:
          method: POST
          path: /shop/v1/fulfillments/{id}/courier-handover
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # The order console: carries the order's money, tags, notes and history. Same gate as fulfilment.
  ordersListV1:
    handler: src/functions/orders-list-v1-get.handler
    description: Order console list — server-side search/filters/sort/paging + per-state counts — 057 A3
    events:
      - httpApi:
          method: GET
          path: /shop/v1/orders
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  orderGetV1:
    handler: src/functions/order-get-v1-get.handler
    description: Order console detail — lines, money, refunds, tags, notes; acknowledges on open — 057 A3
    events:
      - httpApi:
          method: GET
          path: /shop/v1/orders/{id}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # Today (live, counted on every read) and Insights (prepared rollups): one payload cannot claim two freshnesses.
  availabilityV1:
    handler: src/functions/availability-v1-get.handler
    description: Availability — every size the shop sells, its stock and its on-sale state — 099
    events:
      - httpApi:
          method: GET
          path: /shop/v1/availability
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  todayV1:
    handler: src/functions/today-v1-get.handler
    description: Today — live pick backlog, needs-attention list and the five most recent orders — 058
    events:
      - httpApi:
          method: GET
          path: /shop/v1/today
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  liveV1:
    handler: src/functions/live-v1-get.handler
    description: Which live-update channel is this operator's — read on sign-in and reconnect, never on a timer — 071
    events:
      - httpApi:
          method: GET
          path: /shop/v1/live
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  insightsV1:
    handler: src/functions/insights-v1-get.handler
    description: Insights — prepared figures from the rollups; never an aggregate over raw orders — 058
    events:
      - httpApi:
          method: GET
          path: /shop/v1/insights
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # The rollup job and its nightly check. The dirty table is the queue, so a failed run loses nothing.
  teamActivityV1:
    handler: src/functions/team-activity-v1-get.handler
    description: Team activity — a union over the audit trails the platform already keeps — 058
    events:
      - httpApi:
          method: GET
          path: /shop/v1/team-activity
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  pickListsV1:
    handler: src/functions/pick-lists-v1-get.handler
    description: Batch pick lists — every order awaiting pick, as printable documents (no money) — 058
    events:
      - httpApi:
          method: GET
          path: /shop/v1/pick-lists
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  insightsRollup:
    handler: src/functions/insights-rollup.handler
    description: Recompute dirty insight buckets from source; keep the current hour fresh (058)
    timeout: 60
    events:
      - schedule: rate(1 minute)

  insightsReconcile:
    handler: src/functions/insights-reconcile.handler
    description: Nightly sweep — recompute 35 days per shop and alarm if anything had to change (058)
    timeout: 300
    events:
      # 03:30 Melbourne (17:30 UTC): after the shops shut, before anyone reads yesterday.
      - schedule: cron(30 17 * * ? *)

  orderActivityV1:
    handler: src/functions/order-activity-v1-get.handler
    description: Order console activity log — events, refunds, collection, arrival — 057 A3
    events:
      - httpApi:
          method: GET
          path: /shop/v1/orders/{id}/activity
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  orderTagsV1:
    handler: src/functions/order-tags-v1-put.handler
    description: Replace an order's tag set (absolute, idempotent; logged) — 057 A3
    events:
      - httpApi:
          method: PUT
          path: /shop/v1/orders/{id}/tags
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  orderPicksV1:
    handler: src/functions/order-picks-v1-post.handler
    description: Item-level picking — tick / select all / adjust a line (part, unavailable, note); logged — 057 A3
    events:
      - httpApi:
          method: POST
          path: /shop/v1/orders/{id}/picks
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  orderNotesV1:
    handler: src/functions/order-notes-v1-post.handler
    description: Add an internal note to an order (append-only; logged) — 057 A3
    events:
      - httpApi:
          method: POST
          path: /shop/v1/orders/{id}/notes
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # Bags: declare, void, print record, pack-scan
  parcelsPutV1:
    handler: src/functions/parcels-put-v1.handler
    description: Set how many bags per zone the shop packed (096)
    events:
      - httpApi:
          method: PUT
          path: /shop/v1/fulfillments/{id}/parcels
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  parcelVoidV1:
    handler: src/functions/parcel-void-v1-post.handler
    description: Remove one bag (bag 1 never; once printed, only the last) (096)
    events:
      - httpApi:
          method: POST
          path: /shop/v1/fulfillments/{id}/parcels/{parcelId}/void
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  parcelPrintsV1:
    handler: src/functions/parcel-prints-v1-post.handler
    description: Record bag labels sent to a printer (096)
    events:
      - httpApi:
          method: POST
          path: /shop/v1/fulfillments/parcels/prints
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  parcelPackScansV1:
    handler: src/functions/parcel-pack-scans-v1-post.handler
    description: Confirm bags as they are packed by scanning their labels (096)
    events:
      - httpApi:
          method: POST
          path: /shop/v1/fulfillments/{id}/parcels/pack-scans
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  shopDevicesV1Post:
    handler: src/functions/shop-devices-v1-post.handler
    description: Register/refresh this device's FCM push token for the signed-in shop operator (050)
    events:
      - httpApi:
          method: POST
          path: /shop/v1/devices
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  shopDevicesV1IdDelete:
    handler: src/functions/shop-devices-v1-id-delete.handler
    description: Unregister a device token (sign-out / shared-device safety); only the caller's own (050 FR-020)
    events:
      - httpApi:
          method: DELETE
          path: /shop/v1/devices/{token}
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # The attention evaluator, every five minutes: a person then walks across the shop; a minute sooner helps no one.
  attentionEvaluate:
    handler: src/functions/attention-evaluate.handler
    description: Detect newly-appeared attention conditions per shop and enqueue one notification per kind (059 US3)
    timeout: 60
    events:
      - schedule: rate(5 minutes)

  # Notification preferences, per registration (token), not per operator.
  shopNotificationPrefsV1Get:
    handler: src/functions/shop-notification-prefs-v1-get.handler
    description: What this device's notification settings are, and which types exist (059 FR-024)
    events:
      - httpApi:
          method: GET
          path: /shop/v1/notification-preferences
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  shopNotificationPrefsV1Patch:
    handler: src/functions/shop-notification-prefs-v1-patch.handler
    description: Mute/unmute notification types on this device only (059 FR-024/FR-025)
    events:
      - httpApi:
          method: PATCH
          path: /shop/v1/notification-preferences
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # Team management
  teamListV1:
    handler: src/functions/team-list-v1-get.handler
    description: This shop's roster — 057
    events:
      - httpApi:
          method: GET
          path: /shop/v1/team
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  teamInviteV1:
    handler: src/functions/team-invite-v1-post.handler
    description: Invite a colleague (manager only) — 057
    events:
      - httpApi:
          method: POST
          path: /shop/v1/team/invite
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  teamRoleV1:
    handler: src/functions/team-role-v1-patch.handler
    description: Change a colleague's role (manager only) — 057
    events:
      - httpApi:
          method: PATCH
          path: /shop/v1/team/{staffId}/role
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  teamDeactivateV1:
    handler: src/functions/team-deactivate-v1-post.handler
    description: Stand a colleague down (manager only) — 057
    events:
      - httpApi:
          method: POST
          path: /shop/v1/team/{staffId}/deactivate
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

  # A shop manager's route into @effy/edge-shared/payments; timeout 25 (it calls Stripe).
  orderRefundV1:
    handler: src/functions/order-refund-v1-post.handler
    description: Shop manager — refund lines in this shop's own portion of an order. Record-gated (active manager, active shop, shop is on the order).
    timeout: 25
    events:
      - httpApi:
          method: POST
          path: /shop/v1/orders/{orderId}/refunds
          authorizer:
            type: jwt
            id: ${ssm:/effy/${sls:stage}/edge/authorizer/shop_id}

# No `resources:` block: a server error on any route is caught by `effy-<env>-edge-api-5xx`. The three
# scheduled functions have failure alarms in Terraform (insights.tf, background-functions.tf) that
# address them by name; `background-alarms.contract.test.ts` fails a rename on one side only.
