# The public catalogue: no route takes a credential (anything that needs to know who is asking
# belongs in commerce). Connects as the shopper role; every function exports through `shopperHandler`.
service: effy-edge-storefront
frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-offline

params:
  default:
    logLevel: info
    secretsExtensionArn: arn:aws:lambda:ap-southeast-2:665172237481:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:90
  dev:
    logLevel: debug

provider:
  name: aws
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  # The first thing a shopper waits on, and CPU scales with memory.
  memorySize: 512
  timeout: 10
  logRetentionInDays: 30
  versionFunctions: false
  tags:
    project: effy
    slice: 070-retire-core-api
    service: storefront
  httpApi:
    id: ${ssm:/effy/${sls:stage}/edge/http_api_id}
  environment:
    EFFY_ENV: ${sls:stage}
    LOG_LEVEL: ${param:logLevel}
    METRIC_NAMESPACE: Effy/Storefront
    DB_HOST: ${ssm:/effy/${sls:stage}/db/endpoint}
    DB_PORT: ${ssm:/effy/${sls:stage}/db/port}
    DB_NAME: ${ssm:/effy/${sls:stage}/db/name}
    DB_USER: ${ssm:/effy/${sls:stage}/db/shopper_username}
    DB_SECRET_ARN: ${ssm:/effy/${sls:stage}/db/shopper_secret_arn}
    MEDIA_PUBLIC_BASE_URL: ${ssm:/effy/${sls:stage}/media/public_base_url}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: ${ssm:/effy/${sls:stage}/db/shopper_secret_arn}
  layers:
    - ${param:secretsExtensionArn}
  # No provider.vpc: without NAT an in-VPC Lambda cannot reach AWS APIs (dev only).

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    format: esm
    outputFileExtension: .mjs
    banner:
      js: import { createRequire } from 'module'; const require = createRequire(import.meta.url);

package:
  individually: true

functions:
  healthz:
    handler: src/functions/healthz-get.handler
    description: Liveness — is the storefront service deployed and executing? Touches nothing. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/healthz

  readyz:
    handler: src/functions/readyz-get.handler
    description: Readiness — can the storefront service serve? Probes the DB under a 2s budget. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/readyz

  # The catalogue: every route is public.

  homeV1:
    handler: src/functions/home-v1-get.handler
    description: Home — advertised promotions as banners, plus the Featured, On-sale and category rails. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/home

  categoriesV1:
    handler: src/functions/categories-v1-get.handler
    description: The active category tree with product counts and a representative image. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/categories

  suggestionsV1:
    handler: src/functions/suggestions-v1-get.handler
    description: Search suggestions for the text typed so far - phrases from the catalogue and a few products. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/suggestions

  facetsV1:
    handler: src/functions/facets-v1-get.handler
    description: Facet options and counts for the current search, each counted with its own selection cleared. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/facets

  productsV1:
    handler: src/functions/products-v1-get.handler
    description: Product search and browse (filters, four sorts, total, keyset paging), or hydrate a set by ids. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/products

  productV1:
    handler: src/functions/product-v1-get.handler
    description: One product page — gallery, description, grouped attributes, category path. Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/products/{id}

  promotionV1:
    handler: src/functions/promotion-v1-get.handler
    description: One promotion open to everyone, re-checked as live at the moment it is read (094). Public.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/promotions/{id}

  promotionGroupsV1:
    handler: src/functions/promotion-groups-v1-get.handler
    description: Display groups by key — everyone-audience promotions in group order (094). Public, listing cache.
    events:
      - httpApi:
          method: GET
          path: /storefront/v1/promotion-groups
