[versions]
agp = "9.1.0"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
# 024 — the Android 12+ splash screen is AUTOMATIC and cannot be opted out of. This AndroidX
# library is the documented way to configure it, and it backports the same API to API 21 — so one
# mechanism covers the whole minSdk 24 … targetSdk 36 range (spec FR-012).
androidx-splashscreen = "1.0.1"
androidx-espresso = "3.7.0"
# 013 D19: pinned DOWN from 2.11.0-beta01 — no beta lifecycle under a stable Compose runtime.
androidx-lifecycle = "2.10.0"
androidx-testExt = "1.3.0"
# ⚠ composeMultiplatform, kotlin AND material3 MOVE TOGETHER, AND MATCH THE OTHER TWO MOBILE APPS.
# `material3` is a SEPARATE version ref because JetBrains releases it on its own cadence, which makes
# it the one dependency here that can silently fall out of step with the Compose it is compiled
# against.
#
# ⚠ THIS ALREADY HAPPENED, AND IT BRICKED THE APP. Commit 6c7beaf ("remove MapLibre") also bumped
# composeMultiplatform 1.11.1 → 1.12.0 and kotlin 2.4.0 → 2.4.20, leaving material3 at 1.11.0-alpha07.
# material3 1.11 calls `androidx.compose.foundation.style.StyleScope.border(Dp, Color)`, whose
# signature changed in foundation 1.12 — so every screen carrying an OutlinedTextField died at
# runtime with:
#
#     kotlin.internal.IrLinkageError: Function 'border' can not be called
#
# ⚠ NOTHING CAUGHT IT. Gradle resolved, Kotlin compiled, the host tests passed: Kotlin/Native defers
# an unresolved symbol to RUNTIME, which is what IrLinkageError is. The first screen with a text field
# is the SIGN-IN screen, so the app aborted on launch and looked like a startup bug rather than a
# dependency one. 024's VectorDrawable and 058's WriteTimeout shape — valid, compiling, tested, wrong
# only where it runs.
#
# Before changing any of these three, check what customer-mobile and shop-mobile pin and move all
# three apps together, or this app diverges from the platform baseline CLAUDE.md records.
composeMultiplatform = "1.11.1"
junit = "4.13.2"
kotlin = "2.4.0"
material3 = "1.11.0-alpha07"
# 013 — networking, auth, nav, config, storage, async
ktor = "3.5.1"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
navigation3 = "1.1.1"
lifecycleViewmodelNav3 = "2.10.0"
multiplatformSettings = "1.3.0"
buildkonfig = "0.22.0"
amplify = "2.25.0"
desugarJdkLibs = "2.1.4"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.6"
firebaseBom = "34.18.0"
posthogAndroid = "3.11.1"
# 060 — in-app camera viewfinder for photo proof (Android only; iOS uses a designed stand-in +
# system-camera handoff until a Swift AVFoundation bridge exists — research R8).
camerax = "1.5.0"
# 060 — rendering a captured proof photo in history. Same version customer-mobile uses.
coil = "3.1.0"

[libraries]
# 060 — CameraX, androidMain only. ⚠ This CLOSES a live defect as a side effect: rememberPhotoCapture
# returns null on iOS, so photo proof is hidden there entirely today.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
# 026 — the OFFICIAL adaptive navigation container (bottom bar <-> navigation rail, plus an
# animated hide/show of the navigation component). Same `material3` version ref as the core
# artifact above: it is the same release train, not a second one to keep in step. Publishes
# iosArm64 + iosSimulatorArm64 klibs, and its public API needs no caller opt-in.
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-uiTestJunit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# 013 — multiplatform BackHandler (wire OS back to our navigator; Android hardware/gesture back)
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }

# 013 — networking (Ktor 3.x): one client per base URL, bearer plugin delegating to AuthDriver (D20/D21)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
# Android engine = HttpURLConnection (NOT okhttp) — so Ktor doesn't pull okhttp 4.x and clash with
# Amplify's AWS SDK, which needs okhttp 5.x (okhttp3.ConnectionListener). 013 runtime fix.
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# 013 — serialization + async
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# 050 — Firebase + PostHog (androidMain only; iOS keeps NoOp until its Swift bridges land).
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
posthog-android = { module = "com.posthog:posthog-android", version.ref = "posthogAndroid" }
# 013 — Navigation 3 (JetBrains CMP build; user-owned back stack, auth-graph swap — D18)
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
# 013 — non-sensitive prefs ONLY (tokens live in Amplify's secure stores — D11/FR-020)
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatformSettings" }
# 013 — Amplify Android (auth) + the Kotlin coroutines facade (com.amplifyframework.kotlin.core.Amplify).
# iOS uses Amplify SWIFT, injected via the AuthDriver interface (D5).
amplify-auth-cognito = { module = "com.amplifyframework:aws-auth-cognito", version.ref = "amplify" }
amplify-core-kotlin = { module = "com.amplifyframework:core-kotlin", version.ref = "amplify" }
# 013 — Amplify Android REQUIRES core library desugaring (java.time etc. on minSdk 24). AAR metadata enforces it.
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# 013 — kotlinx.serialization + compile-time config (BuildKonfig; the sanctioned BuildConfig replacement on AGP 9, D13)
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
# 050 — applied in :androidApp (where google-services.json lives).
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
