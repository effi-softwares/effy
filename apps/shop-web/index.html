<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 048 — internal operator console: never search-discoverable. Cognito login is the real gate;
         this keeps the console out of search results (paired with public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 024 — Vite injects NO favicon links of its own; without these tags the files in public/ are
         never referenced and the tab falls back to the browser's blank-page icon. Blue colourway,
         shared with shop-mobile so one audience has one mark across both its surfaces (FR-016). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 059 — the console is installable. ⚠ The manifest is served at this exact path only because
         the Amplify SPA rewrite allow-list learned `webmanifest` in the same change; without that it
         returns the app shell as HTML with a 200 and the console is silently not installable. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- --brand light. From the design system's own value; this slice adds no token. -->
    <meta name="theme-color" content="#1d4ed8" />
    <!-- ⚠ iOS/iPadOS reads these, not the manifest, for a home-screen app's title bar. Without
         `apple-mobile-web-app-capable` an added-to-home-screen console opens in a Safari view WITH
         browser chrome — and on iPadOS the Push API is available only to a standalone home-screen
         app, so getting this wrong costs notifications on this audience's primary device. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Effy Shop" />
    <!-- Geist — the platform typeface since the theme adoption (was shop-web-only under 057).
         ⚠ NOT self-hosted (this repository has no Geist woff2 to commit); --font-sans names
         "General Sans" second, which IS self-hosted by the design system, so blocking these links
         degrades to that rather than to a bare system face. Self-hosting is a carry-forward. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- ⚠ PRE-PAINT APPEARANCE RESTORE. Without this the app boots light, JS hydrates, and a dark-mode
         operator gets a full-brightness flash on every load — on a shop tablet under bright lights
         that is the single most visible defect in the console. It is inline and synchronous ON
         PURPOSE: a deferred module cannot beat first paint.
         The key must match createUiStore(…) in src/lib/ui-store.ts; a mismatch silently
         reverts to system, so it is asserted in src/lib/__tests__/appearance.test.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("effy-shop.theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          /* Private mode or blocked storage: fall through to light. Never let this throw — it runs
             before the app and an exception here leaves a blank document. */
        }
      })();
    </script>
    <title>Effy Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
