<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 048 — internal operator console: never search-discoverable. Cognito login is the real gate;
         this keeps the console out of search results (paired with public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 024 — Vite injects NO favicon links of its own; without these tags the files in public/ are
         never referenced and the tab falls back to the browser's blank-page icon. Blue colourway,
         shared with shop-mobile so one audience has one mark across both its surfaces (FR-016). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 057 — Geist is the shop console's adopted typeface. ⚠ NOT self-hosted the way General Sans
         is (this repo has no Geist woff2 to commit); the font stack degrades to the system UI face
         if these are blocked. Self-hosting is a recorded carry-forward. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Effy Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
